<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หลังร้าน — ระบบรับซื้อของเก่า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Kanit:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&family=Mitr:wght@400;500;600;700&family=Chonburi&family=Pattaya&family=Charmonman:wght@400;700&family=Sriracha&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F5F4; --paper-blur:rgba(242,245,244,0.82);
    --ink:#12201C; --muted:#5F716B; --surface:#FFFFFF; --line:#E1E8E5;
    --teal:#0F4C45; --teal-light:#17695F; --tealsoft:#E2F1EE;
    --gold:#9A5B00; --gold-soft:#FFF1D1; --amber:#F5B73B;
    --brick:#C23B2B; --brick-soft:#FDE9E5;
    --sage:#237A52; --sage-soft:#E0F3E8;
    --hover:#F0F6F4;
    --font-display:"Prompt","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
    --radius:16px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(14,48,42,0.06), 0 2px 8px -2px rgba(14,48,42,0.06);
    --shadow-md:0 12px 32px -12px rgba(14,48,42,0.28);
    color-scheme:light;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0A1311; --paper-blur:rgba(10,19,17,0.82);
      --ink:#E7F0ED; --muted:#8CA39C; --surface:#121F1C; --line:#1F332E;
      --teal:#1B7468; --teal-light:#23917F; --tealsoft:#15302B;
      --gold:#F2B94B; --gold-soft:#2C2713; --amber:#F2B94B;
      --brick:#F0705B; --brick-soft:#33201C;
      --sage:#5FC99B; --sage-soft:#14301F;
      --hover:#16261F;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
      --shadow-md:0 12px 32px -12px rgba(0,0,0,0.7);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A1311; --paper-blur:rgba(10,19,17,0.82);
    --ink:#E7F0ED; --muted:#8CA39C; --surface:#121F1C; --line:#1F332E;
    --teal:#1B7468; --teal-light:#23917F; --tealsoft:#15302B;
    --gold:#F2B94B; --gold-soft:#2C2713; --amber:#F2B94B;
    --brick:#F0705B; --brick-soft:#33201C;
    --sage:#5FC99B; --sage-soft:#14301F;
    --hover:#16261F;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-md:0 12px 32px -12px rgba(0,0,0,0.7);
    color-scheme:dark;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
    font-size:14.5px; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:-0.01em; }
  button{ font-family:inherit; }
  ::selection{ background:var(--gold-soft); }

  /* ---- layout ---- */
  #app{ display:flex; min-height:100%; }
  .sidebar{
    width:240px; flex:0 0 240px; color:#EAF4F1;
    background:
      radial-gradient(120% 60% at 0% 0%, rgba(245,183,59,0.14), transparent 55%),
      linear-gradient(180deg,#0C3F39 0%,#0F4C45 55%,#0A312C 100%);
    display:flex; flex-direction:column; padding:22px 14px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:12px; padding:0 6px 20px; border-bottom:1px solid rgba(234,244,241,0.12); margin-bottom:18px; }
  .brand-mark{ width:46px; height:46px; border-radius:14px; background:var(--amber); color:#3A2600; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:20px; flex:0 0 auto; overflow:hidden; box-shadow:0 6px 16px -6px rgba(0,0,0,0.5); }
  .brand-mark.has-logo{ background:#fff; }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; padding:4px; }
  .brand-text .name{ font-family:var(--font-display); font-size:15px; font-weight:600; line-height:1.25; }
  .brand-text .sub{ font-size:11px; opacity:0.65; margin-top:2px; }
  nav.tabs{ display:flex; flex-direction:column; gap:4px; }
  .tab-btn{
    position:relative; display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px;
    background:transparent; border:none; color:rgba(234,244,241,0.78);
    text-align:left; cursor:pointer; font-size:14.5px; transition:background .18s ease, color .18s ease;
  }
  .tab-btn svg{ width:19px; height:19px; flex:0 0 auto; opacity:0.9; }
  .tab-btn:hover{ background:rgba(234,244,241,0.08); color:#fff; }
  .tab-btn.active{ background:rgba(234,244,241,0.14); color:#fff; font-weight:600; box-shadow:inset 0 0 0 1px rgba(234,244,241,0.08); }
  .tab-btn.active::before{ content:""; position:absolute; left:-14px; top:50%; transform:translateY(-50%); width:4px; height:22px; border-radius:0 4px 4px 0; background:var(--amber); }
  .sidebar-foot{ margin-top:auto; font-size:11px; opacity:0.5; padding:10px 8px 4px; }

  .main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:5; background:var(--paper-blur);
    -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px);
    padding:18px 32px 14px; border-bottom:1px solid var(--line);
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .topbar h1{ font-size:23px; }
  .topbar .stat{ font-size:12.5px; color:var(--muted); background:var(--surface); border:1px solid var(--line); padding:7px 14px; border-radius:999px; box-shadow:var(--shadow-sm); }
  .topbar .stat b{ color:var(--ink); font-weight:600; }
  .topbar .stat b.profit{ color:var(--sage); }
  .content{ padding:26px 32px 64px; max-width:1220px; }

  /* ---- generic components ---- */
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom:26px; }
  .dash-brand{
    display:flex; align-items:center; gap:18px; padding:20px 24px; margin-bottom:20px; color:#fff;
    border-radius:20px; border:none; box-shadow:var(--shadow-md);
    background:
      radial-gradient(70% 140% at 100% 0%, rgba(245,183,59,0.35), transparent 60%),
      linear-gradient(135deg,#0C3F39,#17695F);
  }
  .dash-brand img{ height:56px; max-width:170px; object-fit:contain; background:#fff; padding:8px 14px; border-radius:14px; }
  .dash-brand-name{ font-family:var(--font-display); font-size:19px; font-weight:600; }
  .dash-brand-sub{ font-size:13px; color:rgba(255,255,255,0.78); margin-top:3px; }
  .dash-brand-sub b{ color:var(--amber); font-weight:600; }
  .card{ position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow-sm); }
  .card::after{ content:""; position:absolute; right:-28px; top:-28px; width:96px; height:96px; border-radius:50%; background:var(--tealsoft); opacity:0.9; }
  .cards .card:nth-child(4n+1)::after{ background:var(--gold-soft); }
  .cards .card:nth-child(4n+2)::after{ background:var(--tealsoft); }
  .cards .card:nth-child(4n+3)::after{ background:var(--sage-soft); }
  .cards .card:nth-child(4n+4)::after{ background:var(--brick-soft); }
  .card > *{ position:relative; z-index:1; }
  .card .label{ font-size:12.5px; color:var(--muted); margin-bottom:8px; }
  .card .value{ font-family:var(--font-display); font-size:27px; font-weight:600; letter-spacing:-0.02em; }
  .card .value.brick{ color:var(--brick); }
  .card .value.gold{ color:var(--gold); }
  .card .sub{ font-size:12px; color:var(--muted); margin-top:5px; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap; }
  .panel-head h2{ font-size:16px; }

  .btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:500; cursor:pointer; white-space:nowrap; transition:background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .1s ease; }
  .btn svg{ width:15px; height:15px; }
  .btn:hover{ border-color:var(--teal-light); background:var(--hover); }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:linear-gradient(135deg,var(--teal),var(--teal-light)); border-color:transparent; color:#fff; box-shadow:0 6px 14px -6px rgba(15,76,69,0.6); }
  .btn.primary:hover{ filter:brightness(1.08); background:linear-gradient(135deg,var(--teal),var(--teal-light)); }
  .btn.gold{ background:linear-gradient(135deg,#F7C65A,var(--amber)); border-color:transparent; color:#3A2600; font-weight:600; box-shadow:0 6px 14px -6px rgba(245,183,59,0.7); }
  .btn.gold:hover{ filter:brightness(1.05); background:linear-gradient(135deg,#F7C65A,var(--amber)); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.ghost:hover{ background:var(--hover); border-color:transparent; }
  .btn.danger{ color:var(--brick); }
  .btn.danger:hover{ border-color:var(--brick); background:var(--brick-soft); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; box-shadow:none; }
  .btn.small{ padding:6px 12px; font-size:12.5px; border-radius:9px; }
  .btn.icon-only{ padding:8px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:500; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--paper); color:var(--ink); font-size:14px; font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--teal-light); background:var(--surface); box-shadow:0 0 0 3px rgba(23,105,95,0.18); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-hint{ font-size:11.5px; color:var(--muted); margin-top:5px; }

  .search-wrap{ position:relative; flex:1 1 220px; max-width:340px; }
  .search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; opacity:0.5; }
  .search-wrap input{ width:100%; padding:10px 12px 10px 38px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink); font-size:13.5px; box-shadow:var(--shadow-sm); transition:border-color .15s ease, box-shadow .15s ease; }
  .search-wrap input:focus{ outline:none; border-color:var(--teal-light); box-shadow:0 0 0 3px rgba(23,105,95,0.18); }

  table{ width:100%; border-collapse:collapse; font-size:13.8px; }
  thead th{ text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:11px 18px; background:var(--paper); border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody td{ padding:13px 18px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr{ transition:background .12s ease; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--hover); }
  .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .table-scroll{ overflow-x:auto; }
  .pname{ font-weight:600; }
  .psku{ font-size:12px; color:var(--muted); }
  .tag{ display:inline-block; font-size:11px; font-weight:500; padding:3px 10px; border-radius:999px; background:var(--gold-soft); color:var(--gold); border:1px solid transparent; }
  .tag.brick{ background:var(--brick-soft); color:var(--brick); }
  .tag.sage{ background:var(--sage-soft); color:var(--sage); }
  .qty-edit{ display:flex; align-items:center; gap:6px; }
  .qty-edit input{ width:68px; padding:6px 6px; text-align:center; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink); font-variant-numeric:tabular-nums; }
  .cart-qty-input{ width:58px; padding:6px 4px; text-align:center; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink); font-size:13px; font-weight:600; }
  .cart-qty-input:focus, .qty-edit input:focus{ outline:none; border-color:var(--teal-light); box-shadow:0 0 0 3px rgba(23,105,95,0.18); }
  .stepper{ width:28px; height:28px; border:1px solid var(--line); background:var(--surface); border-radius:9px; cursor:pointer; font-size:15px; line-height:1; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; padding:0; transition:background .15s ease, border-color .15s ease; }
  .stepper svg{ width:13px; height:13px; }
  .stepper:hover{ border-color:var(--teal-light); background:var(--tealsoft); }
  .stepper:disabled{ opacity:0.4; cursor:not-allowed; }

  .empty{ padding:52px 20px; text-align:center; color:var(--muted); }
  .empty svg{ width:44px; height:44px; margin-bottom:12px; opacity:0.35; }
  .empty .hint{ font-size:12.5px; margin-top:5px; }

  .row-thumb{ width:44px; height:44px; border-radius:12px; overflow:hidden; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); flex:0 0 auto; }
  .row-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .row-thumb svg{ width:18px; height:18px; opacity:0.45; }

  .img-upload{ display:flex; align-items:center; gap:14px; }
  .img-preview{ width:76px; height:76px; border-radius:14px; overflow:hidden; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); flex:0 0 auto; }
  .img-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
  .img-preview svg{ width:28px; height:28px; opacity:0.45; }
  .img-actions{ display:flex; flex-direction:column; gap:7px; align-items:flex-start; }
  label.btn{ cursor:pointer; }

  /* ---- profit dashboard ---- */
  .period-tabs{ display:inline-flex; gap:2px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px; }
  .period-tab{ border:none; background:transparent; padding:7px 16px; font-size:13px; border-radius:999px; cursor:pointer; color:var(--muted); font-weight:500; transition:background .15s ease, color .15s ease; }
  .period-tab:hover{ color:var(--ink); }
  .period-tab.active{ background:var(--teal); color:#fff; box-shadow:0 4px 10px -4px rgba(15,76,69,0.6); }
  .bar-chart{ display:flex; align-items:flex-end; gap:10px; padding:24px 20px 8px; height:210px; overflow-x:auto; }
  .bar-col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1 1 0; min-width:30px; height:100%; }
  .bar-col .bar-value{ font-size:10.5px; color:var(--muted); margin-bottom:5px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .bar-col .bar{ width:100%; max-width:38px; background:linear-gradient(180deg,#3E9C8C,#1B7468); border-radius:8px 8px 3px 3px; min-height:4px; opacity:0.55; transition:opacity .15s ease; }
  .bar-col:hover .bar{ opacity:0.9; }
  .bar-col.current .bar{ background:linear-gradient(180deg,#F7C65A,#EDA21A); opacity:1; box-shadow:0 6px 14px -6px rgba(237,162,26,0.8); }
  .bar-col.negative .bar{ background:linear-gradient(180deg,#E7806F,var(--brick)); opacity:0.9; }
  .bar-col .bar-label{ font-size:10px; color:var(--muted); margin-top:8px; white-space:nowrap; }
  .zero-line{ border-top:1px dashed var(--line); }

  /* ---- buy / sell screens ---- */
  .pos-grid{ display:grid; grid-template-columns:1fr 360px; gap:22px; align-items:start; }
  @media (max-width:880px){ .pos-grid{ grid-template-columns:1fr; } }
  .product-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:14px; }
  .p-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; cursor:pointer; text-align:left; color:var(--ink); box-shadow:var(--shadow-sm); transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
  .p-card:hover{ border-color:var(--teal-light); transform:translateY(-3px); box-shadow:var(--shadow-md); }
  .p-card:active{ transform:scale(0.98); }
  .p-thumb{ width:100%; aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:linear-gradient(135deg,var(--tealsoft),var(--paper)); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); margin-bottom:11px; }
  .p-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .p-thumb svg{ width:28px; height:28px; opacity:0.4; }
  .p-card .cat{ display:inline-block; font-size:10.5px; color:var(--teal-light); background:var(--tealsoft); padding:2px 9px; border-radius:999px; margin-bottom:7px; }
  .p-card .nm{ font-size:14px; font-weight:600; margin-bottom:8px; min-height:36px; line-height:1.3; color:var(--ink); }
  .p-card .pr{ font-family:var(--font-display); font-size:18px; color:var(--gold); font-weight:600; letter-spacing:-0.01em; }
  .p-card .pr .u{ font-family:"IBM Plex Sans Thai",sans-serif; font-size:11px; color:var(--muted); font-weight:400; }
  .p-card .st{ font-size:11px; color:var(--muted); margin-top:4px; }

  .cart-panel{ background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow-md); position:sticky; top:96px; max-height:calc(100vh - 116px); display:flex; flex-direction:column; overflow:hidden; }
  .cart-summary-bar{ display:none; }
  .cart-head{ padding:16px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:linear-gradient(180deg,var(--tealsoft),transparent); }
  .seller-fields{ padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:8px; }
  .seller-fields input{ flex:1 1 0; min-width:0; padding:8px 11px; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink); font-size:12.5px; }
  .seller-fields input:focus{ outline:none; border-color:var(--teal-light); box-shadow:0 0 0 3px rgba(23,105,95,0.18); background:var(--surface); }
  .cart-items{ overflow-y:auto; flex:1 1 auto; padding:6px 14px; }
  .cart-row{ display:flex; align-items:center; gap:8px; padding:12px 4px; border-bottom:1px dashed var(--line); }
  .cart-row:last-child{ border-bottom:none; }
  .cart-row .ci-name{ flex:1 1 auto; font-size:13.5px; font-weight:500; line-height:1.3; }
  .cart-row .ci-name .p{ font-size:11.5px; color:var(--muted); font-weight:400; margin-top:2px; }
  .cart-foot{ padding:16px 18px; border-top:1px solid var(--line); background:var(--paper); }
  .cart-total{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .cart-total .lbl{ font-size:13px; color:var(--muted); }
  .cart-total .val{ font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--teal); letter-spacing:-0.02em; }
  @media (prefers-color-scheme: dark){ .cart-total .val{ color:var(--gold); } }
  :root[data-theme="dark"] .cart-total .val{ color:var(--gold); }
  .cart-profit-hint{ font-size:12px; color:var(--sage); margin-bottom:12px; font-weight:500; }

  /* ---- modal ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(6,20,17,0.55); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50; animation:fadein .15s ease; }
  .modal-overlay.sheet-overlay{ align-items:flex-end; padding:0; }
  .modal{ background:var(--surface); border-radius:22px; width:100%; max-width:460px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.5); animation:popin .18s ease; }
  .modal.wide{ max-width:420px; }
  .modal.sheet{ max-width:100%; border-radius:24px 24px 0 0; max-height:88vh; display:flex; flex-direction:column; animation:sheetin .22s ease; }
  .modal.sheet .modal-body{ overflow-y:auto; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)); }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line); }
  .modal-head h3{ font-size:17px; }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ padding:14px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
  .x-btn{ background:none; border:none; cursor:pointer; color:var(--muted); padding:6px; border-radius:9px; display:inline-flex; transition:background .15s ease, color .15s ease; }
  .x-btn:hover{ background:var(--hover); color:var(--ink); }
  .x-btn svg{ width:18px; height:18px; }
  @keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes popin{ from{ opacity:0; transform:translateY(10px) scale(0.98); } to{ opacity:1; transform:none; } }
  @keyframes sheetin{ from{ transform:translateY(40px); opacity:0.6; } to{ transform:none; opacity:1; } }


  /* ---- purchase slip ---- */
  .receipt-doc{ width:300px; background:#fff; color:#1a1a1a; padding:0 18px 22px; font-family:"IBM Plex Sans Thai",sans-serif; font-size:12.5px; line-height:1.55; }
  .receipt-doc .r-shop{ font-family:var(--r-shopname-font, "Taviraj","Noto Serif Thai",serif); font-size:17px; font-weight:700; text-align:center; margin-top:var(--r-logo-offset, 38px); }
  .receipt-doc .r-logo-wrap{ text-align:center; margin-top:var(--r-logo-offset, 38px); margin-bottom:10px; }
  .receipt-doc .r-logo-wrap + .r-shop{ margin-top:0; }
  .receipt-doc .r-logo-wrap img{ max-height:var(--r-logo-size, 100px); max-width:240px; object-fit:contain; }
  .receipt-doc .r-tag{ text-align:center; font-size:11px; color:#777; margin-top:1px; }
  .receipt-doc .r-meta{ text-align:center; font-size:11px; color:#555; margin-top:3px; }
  .receipt-doc hr{ border:none; border-top:1px dashed #999; margin:12px 0; }
  .receipt-doc .r-info{ display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:2px; }
  .receipt-doc table{ width:100%; font-size:12px; }
  .receipt-doc thead th{ padding:4px 0; border-bottom:1px solid #333; color:#333; font-size:11px; }
  .receipt-doc tbody td{ padding:5px 0; border-bottom:none; vertical-align:top; }
  .receipt-doc .r-total-row{ display:flex; justify-content:space-between; font-family:var(--r-total-font, "Taviraj","Noto Serif Thai",serif); font-size:16px; font-weight:700; margin-top:8px; }
  .receipt-doc .r-note{ text-align:center; margin-top:16px; font-size:11.5px; color:#444; }
  .receipt-doc .r-sign{ display:flex; justify-content:space-between; margin-top:28px; font-size:11px; color:#444; }
  .receipt-doc .r-sign div{ width:46%; text-align:center; border-top:1px solid #999; padding-top:5px; }
  .receipt-view-wrap{ display:flex; justify-content:center; background:var(--paper); padding:18px; border-radius:6px; }

  #printArea{ position:fixed; left:-9999px; top:0; }
  @media print{
    body > *:not(#printArea){ display:none !important; }
    #printArea{ position:static !important; left:0 !important; }
    @page{ margin:4mm; }
  }

  /* ---- dashboard PDF report ---- */
  .dash-report{ width:794px; background:#fff; color:#1a1a1a; padding:40px 44px; font-family:"IBM Plex Sans Thai",sans-serif; font-size:13px; line-height:1.5; }
  .dash-report .dr-head{ display:flex; align-items:center; gap:16px; margin-bottom:6px; }
  .dash-report .dr-logo{ height:54px; max-width:160px; object-fit:contain; }
  .dash-report .dr-shop{ font-family:var(--r-shopname-font,"Taviraj",serif); font-size:20px; font-weight:700; }
  .dash-report .dr-meta{ font-size:11.5px; color:#666; }
  .dash-report .dr-title{ font-family:"Taviraj",serif; font-size:22px; font-weight:600; text-align:center; margin:18px 0 2px; }
  .dash-report .dr-cards{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
  .dash-report .dr-card{ flex:1 1 160px; border:1px solid #ddd6c4; border-radius:6px; padding:12px 14px; box-sizing:border-box; }
  .dash-report .dr-card-lbl{ font-size:11px; color:#777; margin-bottom:4px; }
  .dash-report .dr-card-val{ font-family:"Taviraj",serif; font-size:19px; font-weight:700; }
  .dash-report .dr-card-val.gold{ color:#B4801F; }
  .dash-report .dr-card-val.brick{ color:#A5402C; }
  .dash-report .dr-section-title{ font-family:"Taviraj",serif; font-size:15px; font-weight:600; margin:22px 0 10px; border-bottom:2px solid #1C3B37; padding-bottom:5px; }
  .dash-report .dr-bar-chart{ display:flex; align-items:flex-end; gap:6px; height:150px; padding:10px 4px 0; margin-bottom:6px; }
  .dash-report .dr-bar-col{ flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; }
  .dash-report .dr-bar-value{ font-size:9px; color:#777; margin-bottom:3px; white-space:nowrap; }
  .dash-report .dr-bar{ width:100%; max-width:26px; background:#6E7A61; border-radius:3px 3px 0 0; min-height:2px; }
  .dash-report .dr-bar.current{ background:#B4801F; }
  .dash-report .dr-bar.negative{ background:#A5402C; }
  .dash-report .dr-bar-label{ font-size:9px; color:#777; margin-top:5px; white-space:nowrap; }
  .dash-report .dr-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .dash-report .dr-table thead th{ padding:7px 6px; border-bottom:1.5px solid #1C3B37; color:#444; font-size:11px; }
  .dash-report .dr-table tbody td{ padding:7px 6px; border-bottom:1px solid #eee; }
  .dash-report .dr-empty{ color:#888; font-size:12.5px; padding:10px 0; }

  .layout-editor{ display:grid; grid-template-columns:220px 1fr; gap:22px; align-items:start; }
  @media (max-width:640px){ .layout-editor{ grid-template-columns:1fr; } }

  .printer-toggle{ display:flex; align-items:center; gap:10px; font-size:13.5px; cursor:pointer; }
  .printer-toggle input{ width:18px; height:18px; accent-color:var(--teal-light); flex:0 0 auto; }
  .printer-hint{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 18px; margin-top:16px; font-size:12.5px; line-height:1.7; }
  .printer-hint-title{ font-weight:600; margin-bottom:6px; }
  .printer-hint ol{ margin:0 0 8px; padding-left:20px; }
  .printer-hint li{ margin-bottom:4px; }
  .layout-controls input[type="range"]{ width:100%; accent-color:var(--teal-light); }
  .layout-controls label span{ color:var(--gold); font-weight:600; }

  .toast-stack{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:100; padding-bottom:env(safe-area-inset-bottom,0px); }
  .toast{ background:linear-gradient(135deg,#0C3F39,#17695F); color:#fff; padding:12px 18px; border-radius:14px; font-size:13.5px; box-shadow:0 14px 30px -10px rgba(0,0,0,0.45); animation:popin .18s ease; }
  .toast.err{ background:linear-gradient(135deg,#9E2A1D,var(--brick)); }

  .receipt-list-row{ cursor:pointer; }
  .mono{ font-variant-numeric:tabular-nums; }
  .receipt-view-wrap{ border-radius:16px; }

  /* ---- login / sign-up ---- */
  .auth-wrap{ width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background: radial-gradient(60% 50% at 15% 10%, rgba(245,183,59,0.22), transparent 60%), radial-gradient(70% 60% at 90% 100%, rgba(23,105,95,0.28), transparent 60%), var(--paper); }
  .auth-card{ width:100%; max-width:410px; background:var(--surface); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow-md); padding:30px 28px 24px; animation:popin .2s ease; }
  .auth-brand{ text-align:center; margin-bottom:20px; }
  .auth-brand h1{ font-size:21px; }
  .auth-sub{ font-size:12.5px; color:var(--muted); margin-top:3px; }
  .auth-tabs{ display:flex; width:100%; margin-bottom:20px; }
  .auth-tabs .period-tab{ flex:1 1 0; }
  .auth-note{ background:var(--gold-soft); color:var(--gold); border-radius:12px; padding:10px 14px; font-size:12.5px; margin-bottom:18px; text-align:center; }
  .auth-error{ min-height:18px; font-size:12.5px; color:var(--brick); margin-bottom:10px; }
  .auth-foot{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:16px; }

  /* bottom app nav (phone) */
  .bottom-nav{ display:none; }
  @media (max-width:760px){
    #app{ flex-direction:column; }
    .sidebar{ display:none; }
    .bottom-nav{
      display:flex; gap:2px; position:fixed; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:40;
      background:var(--surface); border:1px solid var(--line); border-radius:24px;
      padding:6px; box-shadow:var(--shadow-md);
    }
    .bn-btn{ display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--muted); font-size:9.5px; font-weight:500; padding:7px 2px; border-radius:18px; flex:1 1 0; min-width:0; cursor:pointer; transition:background .18s ease, color .18s ease; }
    .bn-btn span{ display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bn-btn svg{ width:21px; height:21px; }
    .bn-btn.active{ color:var(--teal); background:var(--tealsoft); font-weight:600; }
    @media (prefers-color-scheme: dark){ .bn-btn.active{ color:var(--gold); } }
    :root[data-theme="dark"] .bn-btn.active{ color:var(--gold); }
    .content{ padding:18px 16px calc(100px + env(safe-area-inset-bottom,0px)); }
    .content.has-cart-bar{ padding-bottom:calc(166px + env(safe-area-inset-bottom,0px)); }
    .topbar{ padding:14px 16px 12px; }
    .topbar h1{ font-size:20px; }
    .pos-grid{ grid-template-columns:1fr; }
    .cart-panel{ display:none; }
    .cart-summary-bar{
      display:flex; position:fixed; left:12px; right:12px; z-index:35;
      bottom:calc(86px + env(safe-area-inset-bottom,0px));
      background:linear-gradient(135deg,#0C3F39,#17695F); color:#fff; border-radius:20px; padding:12px 14px 12px 18px;
      align-items:center; justify-content:space-between; gap:10px;
      box-shadow:0 14px 30px -10px rgba(0,0,0,0.5); border:none; cursor:pointer; font-family:inherit;
    }
    .cart-summary-bar .csb-left{ display:flex; flex-direction:column; align-items:flex-start; gap:1px; }
    .cart-summary-bar .csb-count{ font-size:11px; opacity:0.8; }
    .cart-summary-bar .csb-count svg{ width:12px; height:12px; vertical-align:-1px; margin-right:2px; }
    .cart-summary-bar .csb-total{ font-family:var(--font-display); font-size:19px; font-weight:700; }
    .cart-summary-bar .csb-cta{ display:flex; align-items:center; gap:6px; background:linear-gradient(135deg,#F7C65A,var(--amber)); color:#3A2600; padding:9px 16px; border-radius:14px; font-size:13px; font-weight:600; }
    .cart-summary-bar .csb-cta svg{ width:14px; height:14px; }
    .field-row{ grid-template-columns:1fr; }
    .bar-chart{ padding:18px 10px 6px; }
    .card .value{ font-size:23px; }
    .dash-brand{ padding:16px 18px; }
  }
</style>
</head>

function seedPurchases(materials){
  // Generate a light purchase history over the last ~24 days so the profit
  // dashboard has something to show on first load.
  const purchases = [];
  let no = 1;
  const today = new Date();
  for(let dayOffset = 23; dayOffset >= 0; dayOffset--){
    const day = new Date(today);
    day.setDate(day.getDate() - dayOffset);
    const txCount = 1 + Math.floor(Math.random()*3); // 1-3 transactions/day
    for(let t=0; t<txCount; t++){
      const itemCount = 1 + Math.floor(Math.random()*3);
      const chosen = [...materials].sort(()=>Math.random()-0.5).slice(0, itemCount);
      const items = chosen.map(m=>{
        const isPiece = m.unit === 'ลูก';
        const qty = isPiece ? (1 + Math.floor(Math.random()*3)) : Number((0.5 + Math.random()*18).toFixed(2));
        const cost = Number((qty*m.buyPrice).toFixed(2));
        const profit = Number((qty*(m.sellPrice - m.buyPrice)).toFixed(2));
        return { name:m.name, sku:m.sku, unit:m.unit, qty, buyPrice:m.buyPrice, sellPrice:m.sellPrice, cost, profit };
      });
      const totalCost = Number(items.reduce((a,i)=>a+i.cost,0).toFixed(2));
      const totalProfit = Number(items.reduce((a,i)=>a+i.profit,0).toFixed(2));
      const hour = 9 + Math.floor(Math.random()*8);
      const minute = Math.floor(Math.random()*60);
      const date = new Date(day.getFullYear(), day.getMonth(), day.getDate(), hour, minute);
      purchases.push({ id:uid('pu'), no, date: date.toISOString(), sellerName:'', sellerPhone:'', items, totalCost, totalProfit });
      no++;
    }
  }
  return { purchases, nextReceiptNo: no };
}

function seedSales(materials){
  const sales = [];
  let no = 1;
  const today = new Date();
  for(let dayOffset = 23; dayOffset >= 0; dayOffset--){
    if(Math.random() < 0.4) continue; // not every day has a sell-out
    const day = new Date(today);
    day.setDate(day.getDate() - dayOffset);
    const itemCount = 1 + Math.floor(Math.random()*2);
    const chosen = [...materials].sort(()=>Math.random()-0.5).slice(0, itemCount);
    const items = chosen.map(m=>{
      const isPiece = m.unit === 'ลูก';
      const qty = isPiece ? (1 + Math.floor(Math.random()*2)) : Number((1 + Math.random()*12).toFixed(2));
      const amount = Number((qty*m.sellPrice).toFixed(2));
      return { name:m.name, sku:m.sku, unit:m.unit, qty, sellPrice:m.sellPrice, amount };
    });
    const totalAmount = Number(items.reduce((a,i)=>a+i.amount,0).toFixed(2));
    const hour = 10 + Math.floor(Math.random()*7);
    const minute = Math.floor(Math.random()*60);
    const date = new Date(day.getFullYear(), day.getMonth(), day.getDate(), hour, minute);
    sales.push({ id:uid('sl'), no, date: date.toISOString(), buyerName:'', buyerPhone:'', items, totalAmount });
    no++;
  }
  return { sales, nextSaleNo: no };
}

/* ================= HELPERS ================= */
function money(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function moneySigned(n){ n=Number(n||0); return (n<0?'-':'') + '฿' + money(Math.abs(n)); }
function formatQty(n){ n = Number(n||0); return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,'').replace(/\.$/,''); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function startOfWeek(d){ const x=startOfDay(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function startOfMonth(d){ const x=startOfDay(d); x.setDate(1); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
function isToday(iso){
  const d = new Date(iso), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getMaterial(id){ return state.materials.find(m=>m.id===id); }

function toast(msg, type){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err' ? ' err' : '');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);
}

/* ================= DASHBOARD (profit) ================= */
function purchasesInRange(start, end){
  return state.purchases.filter(p=>{ const d = new Date(p.date); return d>=start && d<end; });
}
function sumProfit(list){ return list.reduce((a,p)=>a+p.totalProfit,0); }
function sumCost(list){ return list.reduce((a,p)=>a+p.totalCost,0); }
function sumWeight(list){ return list.reduce((a,p)=>a+p.items.reduce((s,i)=>s+i.qty,0),0); }

function buildBuckets(period){
  const today = new Date();
  const buckets = [];
  if(period==='day'){
    for(let i=13;i>=0;i--){
      const start = startOfDay(addDays(today,-i));
      const end = addDays(start,1);
      buckets.push({ start, end, label: start.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit'}), current: i===0 });
    }
  }else if(period==='week'){
    const thisWeekStart = startOfWeek(today);
    for(let i=7;i>=0;i--){
      const start = addDays(thisWeekStart, -7*i);
      const end = addDays(start,7);
      buckets.push({ start, end, label: start.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit'}), current: i===0 });
    }
  }else if(period==='month'){
    const thisMonthStart = startOfMonth(today);
    for(let i=5;i>=0;i--){
      const start = addMonths(thisMonthStart,-i);
      const end = addMonths(start,1);
      buckets.push({ start, end, label: start.toLocaleDateString('th-TH',{month:'short',year:'2-digit'}), current: i===0 });
    }
  }else{
    const thisYearStart = new Date(today.getFullYear(), 0, 1);
    for(let i=4;i>=0;i--){
      const start = new Date(thisYearStart.getFullYear()-i, 0, 1);
      const end = new Date(thisYearStart.getFullYear()-i+1, 0, 1);
      buckets.push({ start, end, label: start.toLocaleDateString('th-TH',{year:'numeric'}), current: i===0 });
    }
  }
  return buckets.map(b=>{
    const list = purchasesInRange(b.start, b.end);
    return { ...b, profit: sumProfit(list), cost: sumCost(list), weight: sumWeight(list), count: list.length, list };
  });
}
function breakdownByMaterial(list){
  const map = {};
  list.forEach(p=> p.items.forEach(i=>{
    if(!map[i.name]) map[i.name] = { name:i.name, unit:i.unit, qty:0, cost:0, profit:0 };
    map[i.name].qty += i.qty; map[i.name].cost += i.cost; map[i.name].profit += i.profit;
  }));
  return Object.values(map).sort((a,b)=>b.profit-a.profit);
}
const PERIOD_LABEL = { day:'วันนี้', week:'สัปดาห์นี้', month:'เดือนนี้', year:'ปีนี้' };

function getDashboardData(period){
  const buckets = buildBuckets(period);
  const current = buckets[buckets.length-1];
  const maxAbs = Math.max(1, ...buckets.map(b=>Math.abs(b.profit)));
  const breakdown = breakdownByMaterial(current.list);
  const todayPurchases = purchasesInRange(startOfDay(new Date()), addDays(startOfDay(new Date()),1));
  const totalStockValue = state.materials.reduce((a,m)=>a+m.buyPrice*m.stock,0);
  const highStock = state.materials.filter(m=>m.stock>=state.shop.highStockAlert).sort((a,b)=>b.stock-a.stock);
  const overhead = overheadForRange(current.start, current.end);
  const netProfit = current.profit - overhead;
  return { buckets, current, maxAbs, breakdown, todayPurchases, totalStockValue, highStock, overhead, netProfit };
}

function viewDashboard(){

async function exportDashboardPDF(period){
  const btn = document.getElementById('btnExportDashboardPDF');
  if(btn){ btn.disabled = true; btn.textContent = 'กำลังสร้างไฟล์...'; }
  try{
    if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
    const wrapper = document.createElement('div');
    wrapper.style.position = 'fixed';
    wrapper.style.left = '-9999px';
    wrapper.style.top = '0';
    wrapper.style.width = '794px';
    wrapper.innerHTML = dashboardReportHTML(period);
    document.body.appendChild(wrapper);
    const node = wrapper.firstElementChild;
    const canvas = await html2canvas(node, { scale:2, backgroundColor:'#ffffff', windowWidth:794 });
    document.body.removeChild(wrapper);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4' });
    const pageWidthMM = 210, pageHeightMM = 297;
    const imgHeightMM = pageWidthMM * canvas.height / canvas.width;
    const imgData = canvas.toDataURL('image/png');
    let heightLeftMM = imgHeightMM;
    let positionMM = 0;
    pdf.addImage(imgData, 'PNG', 0, positionMM, pageWidthMM, imgHeightMM);
    heightLeftMM -= pageHeightMM;
    while(heightLeftMM > 0){
      positionMM -= pageHeightMM;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, positionMM, pageWidthMM, imgHeightMM);
      heightLeftMM -= pageHeightMM;
    }
    const stamp = new Date().toISOString().slice(0,10);
    pdf.save(`รายงานกำไร-${period}-${stamp}.pdf`);
    toast('ดาวน์โหลดรายงาน PDF แล้ว');
  }catch(e){
    console.error(e);
    toast('สร้างรายงาน PDF ไม่สำเร็จ ลองอีกครั้ง','err');
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = ic('download') + ' Export PDF'; }
  }
}

      Object.assign(editing, {name, sku, category, unit, buyPrice, sellPrice, stock, image: pendingImage});
      toast('แก้ไขข้อมูลแล้ว');
    }else{
      state.materials.push({id:uid('m'), name, sku: sku || uid('sku').toUpperCase(), category, unit, buyPrice, sellPrice, stock, image: pendingImage});
      toast('เพิ่มประเภทของเก่าแล้ว');
    }
    saveState(); closeModal(); renderContent();
  };
}

function compressImage(file, onDone, onError){
  const reader = new FileReader();
  reader.onerror = ()=> onError && onError();
  reader.onload = (e)=>{
    const img = new Image();
    img.onerror = ()=> onError && onError();
    img.onload = ()=>{
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      onDone(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function addToCart(mode, mid){
  const m = getMaterial(mid); if(!m) return;
  const cart = cartArray(mode);
  const row = cart.find(c=>c.materialId===mid);
  if(mode==='sell'){
    const current = row ? row.qty : 0;
    if(current+1 > m.stock){ toast('สต๊อกไม่พอ','err'); return; }
  }
  if(row){ row.qty += 1; }
  else cart.push({materialId:mid, qty:1});
  saveState(); renderContent(); refreshCartSheetIfOpen(mode);
}
function changeCartQty(mode, mid, delta){
  const cart = cartArray(mode);
  const row = cart.find(c=>c.materialId===mid);
  if(!row) return;
  const m = getMaterial(mid);
  const next = Number((row.qty + delta).toFixed(2));
  if(next <= 0){ setCartArray(mode, cart.filter(c=>c.materialId!==mid)); }
  else{
    if(mode==='sell' && m && next > m.stock){ toast('สต๊อกไม่พอ','err'); return; }
    row.qty = next;
  }
  saveState(); renderContent(); refreshCartSheetIfOpen(mode);
}
function setCartQty(mode, mid, rawValue){
  const cart = cartArray(mode);
  const row = cart.find(c=>c.materialId===mid);
  if(!row) return;
  const m = getMaterial(mid);
  const v = parseFloat(rawValue);
  if(isNaN(v) || v<=0){ setCartArray(mode, cart.filter(c=>c.materialId!==mid)); saveState(); renderContent(); refreshCartSheetIfOpen(mode); return; }
  if(mode==='sell' && m && v > m.stock){ toast('สต๊อกไม่พอ ปรับเป็นจำนวนคงเหลือสูงสุดแล้ว','err'); row.qty = m.stock; }
  else row.qty = v;
  saveState(); renderContent(); refreshCartSheetIfOpen(mode);
}
function removeFromCart(mode, mid){
  setCartArray(mode, cartArray(mode).filter(x=>x.materialId!==mid));
  saveState(); renderContent(); refreshCartSheetIfOpen(mode);
}
function clearCartAction(mode){
  setCartArray(mode, []);
  saveState(); renderContent(); refreshCartSheetIfOpen(mode);
}

function bindCartEvents(container){
  container.querySelectorAll('[data-cart-inc]').forEach(b=> b.onclick = ()=> changeCartQty(b.dataset.cartMode||'buy', b.dataset.cartInc, 1));
  container.querySelectorAll('[data-cart-dec]').forEach(b=> b.onclick = ()=> changeCartQty(b.dataset.cartMode||'buy', b.dataset.cartDec, -1));
  container.querySelectorAll('[data-cart-qty]').forEach(inp=>{
    inp.addEventListener('change', ()=> setCartQty(inp.dataset.cartMode||'buy', inp.dataset.cartQty, inp.value));
  });
  container.querySelectorAll('[data-cart-remove]').forEach(b=> b.onclick = ()=> removeFromCart(b.dataset.cartMode||'buy', b.dataset.cartRemove));
}

  const prevPhone = overlay.querySelector('#sheetPartyPhone');
  const keepName = prevName ? prevName.value : '';
  const keepPhone = prevPhone ? prevPhone.value : '';
  if(bodyEl) bodyEl.innerHTML = cartSheetBodyHTML(mode);

function checkout(sellerNameArg, sellerPhoneArg){
  if(!state.cart.length) return;
  const sellerName = sellerNameArg != null ? sellerNameArg : (document.getElementById('sellerName') ? document.getElementById('sellerName').value.trim() : '');
  const sellerPhone = sellerPhoneArg != null ? sellerPhoneArg : (document.getElementById('sellerPhone') ? document.getElementById('sellerPhone').value.trim() : '');
  const items = state.cart.map(c=>{
    const m = getMaterial(c.materialId);
    m.stock = Number((m.stock + c.qty).toFixed(3));
    const cost = Number((m.buyPrice*c.qty).toFixed(2));
    const profit = Number(((m.sellPrice-m.buyPrice)*c.qty).toFixed(2));
    return { name:m.name, sku:m.sku, unit:m.unit, qty:c.qty, buyPrice:m.buyPrice, sellPrice:m.sellPrice, cost, profit };
  });
  const totalCost = Number(items.reduce((a,i)=>a+i.cost,0).toFixed(2));
  const totalProfit = Number(items.reduce((a,i)=>a+i.profit,0).toFixed(2));
  const purchase = { id:uid('pu'), no: state.nextReceiptNo, date: new Date().toISOString(), sellerName, sellerPhone, items, totalCost, totalProfit };
  state.purchases.push(purchase);
  state.nextReceiptNo += 1;
  state.cart = [];
  saveState();
  renderContent();
  toast('บันทึกรายการรับซื้อแล้ว');
  openReceiptModal(purchase.id);
  if(state.shop.autoPrint) printReceiptNow(receiptHTML(purchase));
}

function sellCheckout(buyerNameArg, buyerPhoneArg){
  if(!state.sellCart.length) return;
  for(const c of state.sellCart){
    const m = getMaterial(c.materialId);
    if(!m || c.qty > m.stock){ toast(`สต๊อกไม่พอสำหรับ ${m?m.name:'สินค้า'}`,'err'); return; }
  }
  const buyerName = buyerNameArg != null ? buyerNameArg : (document.getElementById('buyerName') ? document.getElementById('buyerName').value.trim() : '');
  const buyerPhone = buyerPhoneArg != null ? buyerPhoneArg : (document.getElementById('buyerPhone') ? document.getElementById('buyerPhone').value.trim() : '');
  const items = state.sellCart.map(c=>{
    const m = getMaterial(c.materialId);
    m.stock = Number((m.stock - c.qty).toFixed(3));
    const amount = Number((m.sellPrice*c.qty).toFixed(2));
    return { name:m.name, sku:m.sku, unit:m.unit, qty:c.qty, sellPrice:m.sellPrice, amount };
  });
  const totalAmount = Number(items.reduce((a,i)=>a+i.amount,0).toFixed(2));
  const sale = { id:uid('sl'), no: state.nextSaleNo, date: new Date().toISOString(), buyerName, buyerPhone, items, totalAmount };
  state.sales.push(sale);
  state.nextSaleNo += 1;
  state.sellCart = [];
  saveState();
  renderContent();
  toast('บันทึกการขายแล้ว รับเงิน ฿'+money(totalAmount));
  openSaleReceiptModal(sale.id);
  if(state.shop.autoPrint) printReceiptNow(saleReceiptHTML(sale));
}

/* ================= OVERHEAD / HIDDEN COSTS (ต้นทุนแฝง) ================= */
function dailyRateOf(o){
  if(o.frequency==='daily') return o.amount;
  if(o.frequency==='monthly') return o.amount/30;
  if(o.frequency==='yearly') return o.amount/365;
  return 0; // 'once' handled separately by exact date
}
function overheadForRange(start, end){
  const days = Math.max(0, Math.round((end-start)/86400000));
  let total = 0;
  state.overheadCosts.forEach(o=>{
    if(o.frequency==='once'){
      if(o.date){ const d = new Date(o.date); if(d>=start && d<end) total += o.amount; }
    }else{
      total += dailyRateOf(o) * days;
    }
  });
  return total;
}
const FREQ_LABEL = { daily:'รายวัน', monthly:'รายเดือน', yearly:'รายปี', once:'ครั้งเดียว' };

async function renderAnyReceiptCanvas(html){
  if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-9999px';
  wrapper.style.top = '0';
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper);
  const node = wrapper.firstElementChild;
  const canvas = await html2canvas(node, { scale: 2.5, backgroundColor: '#ffffff' });
  document.body.removeChild(wrapper);
  return canvas;
}

async function exportSaleReceiptPDF(sale){

    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidthMM, pdfHeightMM);

/* Print via the browser's normal print pipeline (works with any printer registered
   as a system/OS printer — including cheap Bluetooth thermal printers that ship
   with their own print-service app). */
async function printReceiptNow(html){
  if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
  let area = document.getElementById('printArea');
  if(!area){ area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.innerHTML = html;
  let pageStyle = document.getElementById('printPageSize');
  if(!pageStyle){ pageStyle = document.createElement('style'); pageStyle.id = 'printPageSize'; document.head.appendChild(pageStyle); }
  const w = (state.shop.paperWidth || 80);
  pageStyle.textContent = `@media print{ @page{ size:${w}mm auto; margin:3mm; } }`;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.print();
    });
  });
}

async function exportSelectedReceiptsPDF(){
  const ids = [...selectedReceiptIds];
  if(!ids.length){ toast('กรุณาเลือกอย่างน้อย 1 รายการ','err'); return; }
  const purchasesToExport = state.purchases.filter(p=>ids.includes(p.id)).sort((a,b)=>a.no-b.no);
  const btn = document.getElementById('btnExportSelectedReceipts');
  if(btn){ btn.disabled = true; btn.textContent = `กำลังสร้างไฟล์... (0/${purchasesToExport.length})`; }
  try{
    const { jsPDF } = window.jspdf;
    const pdfWidthMM = state.shop.paperWidth || 80;
    let pdf = null;
    for(let i=0;i<purchasesToExport.length;i++){
      const purchase = purchasesToExport[i];
      const canvas = await renderReceiptCanvas(purchase);
      const pdfHeightMM = Math.max(120, pdfWidthMM * canvas.height / canvas.width);
      const imgData = canvas.toDataURL('image/png');
      if(!pdf){ pdf = new jsPDF({ unit:'mm', format:[pdfWidthMM, pdfHeightMM] }); }
      else{ pdf.addPage([pdfWidthMM, pdfHeightMM], 'p'); }
      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidthMM, pdfHeightMM);
      if(btn) btn.textContent = `กำลังสร้างไฟล์... (${i+1}/${purchasesToExport.length})`;
    }
    const stamp = new Date().toISOString().slice(0,10);
    pdf.save(`ใบรับซื้อ-รวม-${purchasesToExport.length}รายการ-${stamp}.pdf`);
    toast(`ดาวน์โหลด PDF รวม ${purchasesToExport.length} ใบแล้ว`);
    selectedReceiptIds.clear();
    renderContent();
  }catch(e){
    console.error(e);
    toast('สร้าง PDF รวมไม่สำเร็จ ลองอีกครั้ง','err');
  }finally{
    if(btn && document.body.contains(btn)){ btn.disabled = !selectedReceiptIds.size; btn.innerHTML = ic('download') + ' PDF รวม'; }
  }
}

function compressImageToPNG(file, onDone, onError){
  const reader = new FileReader();
  reader.onerror = ()=> onError && onError();
  reader.onload = (e)=>{
    const img = new Image();
    img.onerror = ()=> onError && onError();
    img.onload = ()=>{
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else{ w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      onDone(canvas.toDataURL('image/png'));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ================= MODAL ================= */
function openModal(title, bodyHTML, footHTML, variant){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay' + (variant==='sheet' ? ' sheet-overlay' : '');
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal ${variant==='wide'?'wide':''} ${variant==='sheet'?'sheet':''}">
      <div class="modal-head"><h3>${title}</h3><button class="x-btn" id="modalX">${ic('close')}</button></div>
      <div class="modal-body">${bodyHTML}</div>
      ${footHTML ? `<div class="modal-foot">${footHTML}</div>` : ''}
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('modalX').onclick = closeModal;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.addEventListener('keydown', escHandler);
}
function escHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const o = document.getElementById('modalOverlay');
  if(o) o.remove();
  document.removeEventListener('keydown', escHandler);
}

/* ================= EVENT BINDING ================= */
function bindContentEvents(){
  const c = document.getElementById('content');
  if(!c) return;

  // dashboard period tabs
  c.querySelectorAll('[data-period]').forEach(b=>{
    b.onclick = ()=>{ state.ui.dashPeriod = b.dataset.period; saveState(); renderContent(); };
  });
  const btnExportDashboardPDF = document.getElementById('btnExportDashboardPDF');
  if(btnExportDashboardPDF) btnExportDashboardPDF.onclick = ()=> exportDashboardPDF(state.ui.dashPeriod || 'day');

  // stock search
  const stockSearch = document.getElementById('stockSearch');
  if(stockSearch){
    stockSearch.addEventListener('input', ()=>{ state.ui.stockQ = stockSearch.value; renderContent(); });
    stockSearch.focus(); stockSearch.selectionStart = stockSearch.selectionEnd = stockSearch.value.length;
  }
  const addBtn = document.getElementById('btnAddProduct');
  if(addBtn) addBtn.onclick = ()=> openProductModal(null);

  c.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> openProductModal(b.dataset.edit));
  c.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=> deleteProductConfirm(b.dataset.del));

  c.querySelectorAll('[data-stock-inc]').forEach(b=> b.onclick = ()=>{
    const m = getMaterial(b.dataset.stockInc); if(m){ m.stock = Number((m.stock+1).toFixed(3)); saveState(); renderContent(); }
  });
  c.querySelectorAll('[data-stock-dec]').forEach(b=> b.onclick = ()=>{
    const m = getMaterial(b.dataset.stockDec); if(m && m.stock>0){ m.stock = Math.max(0, Number((m.stock-1).toFixed(3))); saveState(); renderContent(); }
  });
  c.querySelectorAll('[data-price-input]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const m = getMaterial(inp.dataset.priceInput);
      const v = parseFloat(inp.value);

    inp.addEventListener('change', ()=>{
      const m = getMaterial(inp.dataset.stockInput);
      const v = parseFloat(inp.value);
      if(m && !isNaN(v) && v>=0){ m.stock = v; saveState(); }
      renderContent();
    });
  });

  // BUY screen
  const posSearch = document.getElementById('posSearch');
  if(posSearch){
    posSearch.addEventListener('input', ()=>{ state.ui.posQ = posSearch.value; renderContent(); });
  }
  const posCat = document.getElementById('posCat');

  // SELL screen
  const sellSearch = document.getElementById('sellSearch');
  if(sellSearch){
    sellSearch.addEventListener('input', ()=>{ state.ui.sellQ = sellSearch.value; renderContent(); });
  }
  const sellCatSel = document.getElementById('sellCatSel');
  if(sellCatSel) sellCatSel.addEventListener('change', ()=>{ state.ui.sellCat = sellCatSel.value; renderContent(); });

  c.querySelectorAll('[data-add]').forEach(b=> b.onclick = ()=> addToCart(b.dataset.cartMode||'buy', b.dataset.add));
  bindCartEvents(c);
  c.querySelectorAll('[data-clear-cart]').forEach(b=> b.onclick = ()=> clearCartAction(b.dataset.clearCart));
  c.querySelectorAll('[data-checkout]').forEach(b=> b.onclick = ()=>{
    if(b.dataset.checkout==='sell') sellCheckout(); else checkout();
  });
  c.querySelectorAll('[data-open-sheet]').forEach(b=> b.onclick = ()=> openCartSheet(b.dataset.openSheet));

  // History sub-tabs
  c.querySelectorAll('[data-history-tab]').forEach(b=>{
    b.onclick = ()=>{ state.ui.historyTab = b.dataset.historyTab; saveState(); renderContent(); };
  });

  // Receipts
  c.querySelectorAll('[data-view-receipt]').forEach(el=>{
    el.addEventListener('click', ()=> openReceiptModal(el.dataset.viewReceipt));
  });
  c.querySelectorAll('[data-pdf-receipt]').forEach(el=>{
    el.addEventListener('click', (e)=>{

  c.querySelectorAll('[data-select-receipt]').forEach(cb=>{

      if(cb.checked) selectedReceiptIds.add(cb.dataset.selectReceipt);

    selectAllReceipts.addEventListener('click', e=> e.stopPropagation());

  const btnExportSelectedReceipts = document.getElementById('btnExportSelectedReceipts');

  // Settings

    sAutoPrint.addEventListener('change', ()=>{

      saveState();
      toast(sAutoPrint.checked ? 'เปิดพิมพ์ใบเสร็จอัตโนมัติแล้ว' : 'ปิดพิมพ์ใบเสร็จอัตโนมัติแล้ว');

  const fLogo = document.getElementById('fLogo');

  const fLogoRemove = document.getElementById('fLogoRemove');
  if(fLogoRemove){
    fLogoRemove.onclick = ()=>{
      state.shop.logo = null;
      saveState(); toast('ลบโลโก้แล้ว'); render();

  }
  const rLogoSize = document.getElementById('rLogoSize');
  const rLogoOffset = document.getElementById('rLogoOffset');
  const selShopFont = document.getElementById('selShopFont');
  const selTotalFont = document.getElementById('selTotalFont');
  function applyLayoutPreview(){

    if(previewDoc){

      previewDoc.style.setProperty('--r-logo-offset', state.shop.logoOffset+'px');

    const offVal = document.getElementById('logoOffsetVal');
    if(offVal) offVal.textContent = state.shop.logoOffset;
  }
  if(selShopFont){
    selShopFont.addEventListener('change', ()=>{
      state.shop.shopNameFont = selShopFont.value;
      applyLayoutPreview(); saveState();
    });
  }
  if(selTotalFont){
    selTotalFont.addEventListener('change', ()=>{

  }
  if(rLogoSize){
    rLogoSize.addEventListener('input', ()=>{
      state.shop.logoSize = parseInt(rLogoSize.value,10);
      applyLayoutPreview(); saveState();
    });
  }
  if(rLogoOffset){

/* ================= AUTH (บัญชีผู้ใช้ — เก็บในเบราว์เซอร์นี้) ================= */
const AUTH_KEY = 'scrapShopAuth_v1';
const SESSION_KEY = 'scrapShopSession_v1';
let authUser = null;
let authMode = 'login';

function loadAuth(){
  try{
    const a = JSON.parse(localStorage.getItem(AUTH_KEY));
    if(a && Array.isArray(a.users)) return a;
  }catch(e){}
  return { users:[] };
}
function saveAuth(a){
  try{ localStorage.setItem(AUTH_KEY, JSON.stringify(a)); return true; }
  catch(e){ return false; }
}
function bufToHex(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function hexToBytes(hex){
  const out = new Uint8Array(hex.length/2);
  for(let i=0;i<out.length;i++) out[i] = parseInt(hex.substr(i*2,2),16);
  return out;
}
async function hashPassword(pw, saltHex){
  const salt = saltHex ? hexToBytes(saltHex) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' }, key, 256);
  return { salt: bufToHex(salt), hash: bufToHex(bits) };
}
function readSessionName(){
  try{ return sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY); }
  catch(e){ return null; }
}
function startSession(user, remember){
  try{
    sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY);
    (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, user.username);
  }catch(e){}
  authUser = user;
  render();
}
function logout(){
  try{ sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY); }catch(e){}
  authUser = null;
  authMode = 'login';
  renderAuth();
}

function renderAuth(){
  closeModal();
  const app = document.getElementById('app');
  const auth = loadAuth();
  const hasUsers = auth.users.length > 0;
  if(!hasUsers) authMode = 'signup';
  const isSignup = authMode === 'signup';
  const shopName = state.shop.name || 'ร้านรับซื้อของเก่า';
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-mark ${state.shop.logo?'has-logo':''}" style="width:64px; height:64px; border-radius:18px; margin:0 auto 12px;">${state.shop.logo ? `<img src="${state.shop.logo}" alt="โลโก้ร้าน">` : esc(shopName.trim()[0]||'ร')}</div>
          <h1>${esc(shopName)}</h1>
          <div class="auth-sub">ระบบหลังร้าน</div>
        </div>
        ${hasUsers ? `
        <div class="period-tabs auth-tabs">
          <button type="button" class="period-tab ${!isSignup?'active':''}" data-auth-mode="login">เข้าสู่ระบบ</button>
          <button type="button" class="period-tab ${isSignup?'active':''}" data-auth-mode="signup">สมัครสมาชิก</button>
        </div>` : `<div class="auth-note">ยังไม่มีบัญชีในเครื่องนี้ บัญชีแรกที่สมัครจะเป็นเจ้าของร้าน</div>`}
        <form id="authForm" autocomplete="on">
          <div class="field"><label>ชื่อผู้ใช้</label><input id="auUser" autocomplete="username" autocapitalize="none" required></div>
          <div class="field"><label>รหัสผ่าน${isSignup?' (อย่างน้อย 6 ตัวอักษร)':''}</label><input id="auPass" type="password" autocomplete="${isSignup?'new-password':'current-password'}" required></div>
          ${isSignup ? `<div class="field"><label>ยืนยันรหัสผ่าน</label><input id="auPass2" type="password" autocomplete="new-password" required></div>` : ''}
          <label class="printer-toggle" style="margin-bottom:14px;"><input type="checkbox" id="auRemember" checked><span>จดจำฉันไว้ในเครื่องนี้</span></label>
          <div class="auth-error" id="auError" role="alert"></div>
          <button class="btn primary" type="submit" id="auSubmit" style="width:100%; justify-content:center; padding:12px;">${isSignup?'สมัครสมาชิก':'เข้าสู่ระบบ'}</button>
        </form>
        <div class="auth-foot">บัญชีและข้อมูลร้านเก็บอยู่ในเบราว์เซอร์เครื่องนี้เท่านั้น</div>
      </div>
    </div>
  `;
  app.querySelectorAll('[data-auth-mode]').forEach(b=>{
    b.onclick = ()=>{ authMode = b.dataset.authMode; renderAuth(); };
  });
  const form = document.getElementById('authForm');
  const errEl = document.getElementById('auError');
  const submitBtn = document.getElementById('auSubmit');
  form.onsubmit = async (e)=>{
    e.preventDefault();
    errEl.textContent = '';
    const username = document.getElementById('auUser').value.trim().toLowerCase();
    const pw = document.getElementById('auPass').value;
    const remember = document.getElementById('auRemember').checked;
    if(!(window.crypto && crypto.subtle)){
      errEl.textContent = 'เบราว์เซอร์นี้ยังเข้ารหัสรหัสผ่านไม่ได้ ให้เปิดเว็บผ่านลิงก์ https';
      return;
    }
    submitBtn.disabled = true;
    try{
      const a = loadAuth();
      if(isSignup){
        const pw2 = document.getElementById('auPass2').value;
        if(!/^[\p{L}\p{N}._-]{3,30}$/u.test(username)){ errEl.textContent = 'ชื่อผู้ใช้ต้องยาว 3-30 ตัว ใช้ตัวอักษร ตัวเลข จุด ขีดล่าง หรือขีดกลางเท่านั้น'; return; }
        if(pw.length < 6){ errEl.textContent = 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร'; return; }
        if(pw !== pw2){ errEl.textContent = 'รหัสผ่านสองช่องไม่ตรงกัน'; return; }
        if(a.users.some(u=>u.username===username)){ errEl.textContent = 'ชื่อผู้ใช้นี้ถูกใช้แล้ว'; return; }
        const h = await hashPassword(pw);
        const user = { id:uid('u'), username, role: a.users.length ? 'staff' : 'owner', salt:h.salt, hash:h.hash, createdAt:new Date().toISOString() };
        a.users.push(user);
        if(!saveAuth(a)){ errEl.textContent = 'บันทึกบัญชีไม่สำเร็จ (พื้นที่จัดเก็บเต็มหรือถูกบล็อก)'; return; }
        startSession(user, remember);
      }else{
        const user = a.users.find(u=>u.username===username);
        if(!user){ errEl.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'; return; }
        const h = await hashPassword(pw, user.salt);
        if(h.hash !== user.hash){ errEl.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'; return; }
        startSession(user, remember);
      }
    }catch(err){
      console.error(err);
      errEl.textContent = 'เกิดข้อผิดพลาด ลองอีกครั้ง';
    }finally{
      submitBtn.disabled = false;
    }
  };
  const first = document.getElementById('auUser');
  if(first) first.focus();
}

function boot(){
  const name = readSessionName();
  const user = name ? loadAuth().users.find(u=>u.username===name) : null;
  if(user){ authUser = user; render(); }
  else renderAuth();
}

/* ================= INIT ================= */
boot();
})();
</script>
