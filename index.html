<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SPD">
<title>หลังร้าน — ระบบรับซื้อของเก่า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Kanit:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&family=Mitr:wght@400;500;600;700&family=Chonburi&family=Pattaya&family=Charmonman:wght@400;700&family=Sriracha&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E8EBF1; --paper-blur:rgba(232,235,241,0.86);
    --ink:#0F1115; --muted:#6B7280; --surface:#FFFFFF; --line:#E3E7EE;
    --teal:#0B4DDB; --teal-light:#2D6AF2; --tealsoft:#E5EDFE;
    --gold:#8A5A00; --gold-soft:#FFF3D6; --amber:#D6F53C;
    --lime:#D6F53C; --lime-deep:#B5DB10; --peri:#9DB6F7;
    --brick:#D92D20; --brick-soft:#FEE9E7;
    --sage:#0E8F4B; --sage-soft:#DDF7E8;
    --profit:#0E8F4B; --loss:#D92D20;
    --hover:#F1F4F9;
    --font-display:"Prompt","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
    --radius:28px; --radius-sm:14px;
    --shadow-sm:0 1px 2px rgba(20,30,60,0.04), 0 6px 20px -8px rgba(20,30,60,0.10);
    --shadow-md:0 18px 40px -16px rgba(20,30,60,0.28);
    color-scheme:light;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0C0F14; --paper-blur:rgba(12,15,20,0.86);
      --ink:#EEF1F6; --muted:#98A2B3; --surface:#161A21; --line:#252B35;
      --teal:#3C78FF; --teal-light:#5B8EFF; --tealsoft:#18274A;
      --gold:#F2B94B; --gold-soft:#2C2713; --amber:#D6F53C;
      --brick:#F0705B; --brick-soft:#3A1F1B;
      --sage:#4ADE80; --sage-soft:#12301F;
      --profit:#4ADE80; --loss:#F87171;
      --hover:#1C212B;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
      --shadow-md:0 18px 40px -16px rgba(0,0,0,0.7);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0C0F14; --paper-blur:rgba(12,15,20,0.86);
    --ink:#EEF1F6; --muted:#98A2B3; --surface:#161A21; --line:#252B35;
    --teal:#3C78FF; --teal-light:#5B8EFF; --tealsoft:#18274A;
    --gold:#F2B94B; --gold-soft:#2C2713; --amber:#D6F53C;
    --brick:#F0705B; --brick-soft:#3A1F1B;
    --sage:#4ADE80; --sage-soft:#12301F;
    --profit:#4ADE80; --loss:#F87171;
    --hover:#1C212B;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-md:0 18px 40px -16px rgba(0,0,0,0.7);
    color-scheme:dark;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
    font-size:14.5px; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:-0.01em; }
  button{ font-family:inherit; }
  ::selection{ background:var(--gold-soft); }

  /* ---- layout ---- */
  #app{ display:flex; min-height:100%; }
  .sidebar{
    width:240px; flex:0 0 240px; color:#EAF4F1;
    background:
      radial-gradient(120% 60% at 0% 0%, rgba(245,183,59,0.14), transparent 55%),
      linear-gradient(180deg,#0C3F39 0%,#0F4C45 55%,#0A312C 100%);
    display:flex; flex-direction:column; padding:22px 14px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:12px; padding:0 6px 20px; border-bottom:1px solid rgba(234,244,241,0.12); margin-bottom:18px; }
  .brand-mark{ width:46px; height:46px; border-radius:14px; background:var(--amber); color:#3A2600; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:20px; flex:0 0 auto; overflow:hidden; box-shadow:0 6px 16px -6px rgba(0,0,0,0.5); }
  .brand-mark.has-logo{ background:#fff; }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; padding:4px; }
  .brand-text .name{ font-family:var(--font-display); font-size:15px; font-weight:600; line-height:1.25; }
  .brand-text .sub{ font-size:11px; opacity:0.65; margin-top:2px; }
  nav.tabs{ display:flex; flex-direction:column; gap:4px; }
  .tab-btn{
    position:relative; display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px;
    background:transparent; border:none; color:rgba(234,244,241,0.78);
    text-align:left; cursor:pointer; font-size:14.5px; transition:background .18s ease, color .18s ease;
  }
  .tab-btn svg{ width:19px; height:19px; flex:0 0 auto; opacity:0.9; }
  .tab-btn:hover{ background:rgba(234,244,241,0.08); color:#fff; }
  .tab-btn.active{ background:rgba(234,244,241,0.14); color:#fff; font-weight:600; box-shadow:inset 0 0 0 1px rgba(234,244,241,0.08); }
  .tab-btn.active::before{ content:""; position:absolute; left:-14px; top:50%; transform:translateY(-50%); width:4px; height:22px; border-radius:0 4px 4px 0; background:var(--amber); }
  .sidebar-foot{ margin-top:auto; font-size:11px; opacity:0.5; padding:10px 8px 4px; }

  .main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:5; background:var(--paper-blur);
    -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px);
    padding:18px 32px 14px; border-bottom:1px solid var(--line);
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .topbar h1{ font-size:23px; }
  .topbar .stat{ font-size:12.5px; color:var(--muted); background:var(--surface); border:1px solid var(--line); padding:7px 14px; border-radius:999px; box-shadow:var(--shadow-sm); }
  .topbar .stat b{ color:var(--ink); font-weight:600; }
  .topbar .stat b.profit{ color:var(--sage); }
  .content{ padding:26px 32px 64px; max-width:1220px; }

  /* ---- generic components ---- */
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom:26px; }
  .dash-brand{
    display:flex; align-items:center; gap:18px; padding:20px 24px; margin-bottom:20px; color:#fff;
    border-radius:20px; border:none; box-shadow:var(--shadow-md);
    background:
      radial-gradient(70% 140% at 100% 0%, rgba(245,183,59,0.35), transparent 60%),
      linear-gradient(135deg,#0C3F39,#17695F);
  }
  .dash-brand img{ height:56px; max-width:170px; object-fit:contain; background:#fff; padding:8px 14px; border-radius:14px; }
  .dash-brand-name{ font-family:var(--font-display); font-size:19px; font-weight:600; }
  .dash-brand-sub{ font-size:13px; color:rgba(255,255,255,0.78); margin-top:3px; }
  .dash-brand-sub b{ color:var(--amber); font-weight:600; }
  .card{ position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow-sm); }
  .card::after{ content:""; position:absolute; right:-28px; top:-28px; width:96px; height:96px; border-radius:50%; background:var(--tealsoft); opacity:0.9; }
  .cards .card:nth-child(4n+1)::after{ background:var(--gold-soft); }
  .cards .card:nth-child(4n+2)::after{ background:var(--tealsoft); }
  .cards .card:nth-child(4n+3)::after{ background:var(--sage-soft); }
  .cards .card:nth-child(4n+4)::after{ background:var(--brick-soft); }
  .card > *{ position:relative; z-index:1; }
  .card .label{ font-size:12.5px; color:var(--muted); margin-bottom:8px; }
  .card .value{ font-family:var(--font-display); font-size:27px; font-weight:600; letter-spacing:-0.02em; }
  .card .value.brick{ color:var(--brick); }
  .card .value.gold{ color:var(--gold); }
  .card .sub{ font-size:12px; color:var(--muted); margin-top:5px; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap; }
  .panel-head h2{ font-size:16px; }

  .btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:500; cursor:pointer; white-space:nowrap; transition:background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .1s ease; }
  .btn svg{ width:15px; height:15px; }
  .btn:hover{ border-color:var(--teal-light); background:var(--hover); }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:linear-gradient(135deg,var(--teal),var(--teal-light)); border-color:transparent; color:#fff; box-shadow:0 6px 14px -6px rgba(15,76,69,0.6); }
  .btn.primary:hover{ filter:brightness(1.08); background:linear-gradient(135deg,var(--teal),var(--teal-light)); }
  .btn.gold{ background:linear-gradient(135deg,#F7C65A,var(--amber)); border-color:transparent; color:#3A2600; font-weight:600; box-shadow:0 6px 14px -6px rgba(245,183,59,0.7); }
  .btn.gold:hover{ filter:brightness(1.05); background:linear-gradient(135deg,#F7C65A,var(--amber)); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.ghost:hover{ background:var(--hover); border-color:transparent; }
  .btn.danger{ color:var(--brick); }
  .btn.danger:hover{ border-color:var(--brick); background:var(--brick-soft); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; box-shadow:none; }
  .btn.small{ padding:6px 12px; font-size:12.5px; border-radius:9px; }
  .btn.icon-only{ padding:8px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:500; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--paper); color:var(--ink); font-size:14px; font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--teal-light); background:var(--surface); box-shadow:0 0 0 3px rgba(23,105,95,0.18); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-hint{ font-size:11.5px; color:var(--muted); margin-top:5px; }

  .search-wrap{ position:relative; flex:1 1 220px; max-width:340px; }
  .search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; opacity:0.5; }
  .search-wrap input{ width:100%; padding:10px 12px 10px 38px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink); font-size:13.5px; box-shadow:var(--shadow-sm); transition:border-color .15s ease, box-shadow .15s ease; }
  .search-wrap input:focus{ outline:none; border-color:var(--teal-light); box-shadow:0 0 0 3px rgba(23,105,95,0.18); }

  table{ width:100%; border-collapse:collapse; font-size:13.8px; }
  thead th{ text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:11px 18px; background:var(--paper); border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody td{ padding:13px 18px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr{ transition:background .12s ease; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--hover); }
  .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .table-scroll{ overflow-x:auto; }
  .pname{ font-weight:600; }
  .psku{ font-size:12px; color:var(--muted); }
  .tag{ display:inline-block; font-size:11px; font-weight:500; padding:3px 10px; border-radius:999px; background:var(--gold-soft); color:var(--gold); border:1px solid transparent; }
  .tag.brick{ background:var(--brick-soft); color:var(--brick); }
  .tag.sage{ background:var(--sage-soft); color:var(--sage); }
  .qty-edit{ display:flex; align-items:center; gap:6px; }
  .qty-edit input{ width:68px; padding:6px 6px; text-align:center; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink); font-variant-numeric:tabular-nums; }
  .cart-qty-input{ width:58px; padding:6px 4px; text-align:center; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink); font-size:13px; font-weight:600; }
  .cart-qty-input:focus, .qty-edit input:focus{ outline:none; border-color:var(--teal-light); box-shadow:0 0 0 3px rgba(23,105,95,0.18); }
  .stepper{ width:28px; height:28px; border:1px solid var(--line); background:var(--surface); border-radius:9px; cursor:pointer; font-size:15px; line-height:1; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; padding:0; transition:background .15s ease, border-color .15s ease; }
  .stepper svg{ width:13px; height:13px; }
  .stepper:hover{ border-color:var(--teal-light); background:var(--tealsoft); }
  .stepper:disabled{ opacity:0.4; cursor:not-allowed; }

  .empty{ padding:52px 20px; text-align:center; color:var(--muted); }
  .empty svg{ width:44px; height:44px; margin-bottom:12px; opacity:0.35; }
  .empty .hint{ font-size:12.5px; margin-top:5px; }

  .row-thumb{ width:44px; height:44px; border-radius:12px; overflow:hidden; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); flex:0 0 auto; }
  .row-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .row-thumb svg{ width:18px; height:18px; opacity:0.45; }

  .img-upload{ display:flex; align-items:center; gap:14px; }
  .img-preview{ width:76px; height:76px; border-radius:14px; overflow:hidden; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); flex:0 0 auto; }
  .img-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
  .img-preview svg{ width:28px; height:28px; opacity:0.45; }
  .img-actions{ display:flex; flex-direction:column; gap:7px; align-items:flex-start; }
  label.btn{ cursor:pointer; }

  /* ---- profit dashboard ---- */
  .period-tabs{ display:inline-flex; gap:2px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px; }
  .period-tab{ border:none; background:transparent; padding:7px 16px; font-size:13px; border-radius:999px; cursor:pointer; color:var(--muted); font-weight:500; transition:background .15s ease, color .15s ease; }
  .period-tab:hover{ color:var(--ink); }
  .period-tab.active{ background:var(--teal); color:#fff; box-shadow:0 4px 10px -4px rgba(15,76,69,0.6); }
  .bar-chart{ display:flex; align-items:flex-end; gap:10px; padding:24px 20px 8px; height:210px; overflow-x:auto; }
  .bar-col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1 1 0; min-width:30px; height:100%; }
  .bar-col .bar-value{ font-size:10.5px; color:var(--muted); margin-bottom:5px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .bar-col .bar{ width:100%; max-width:38px; background:linear-gradient(180deg,#3E9C8C,#1B7468); border-radius:8px 8px 3px 3px; min-height:4px; opacity:0.55; transition:opacity .15s ease; }
  .bar-col:hover .bar{ opacity:0.9; }
  .bar-col.current .bar{ background:linear-gradient(180deg,#F7C65A,#EDA21A); opacity:1; box-shadow:0 6px 14px -6px rgba(237,162,26,0.8); }
  .bar-col.negative .bar{ background:linear-gradient(180deg,#E7806F,var(--brick)); opacity:0.9; }
  .bar-col .bar-label{ font-size:10px; color:var(--muted); margin-top:8px; white-space:nowrap; }
  .zero-line{ border-top:1px dashed var(--line); }

  /* ---- buy / sell screens ---- */
  .pos-grid{ display:grid; grid-template-columns:1fr 360px; gap:22px; align-items:start; }
  @media (max-width:880px){ .pos-grid{ grid-template-columns:1fr; } }
  .product-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:14px; }
  .p-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; cursor:pointer; text-align:left; color:var(--ink); box-shadow:var(--shadow-sm); transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
  .p-card:hover{ border-color:var(--teal-light); transform:translateY(-3px); box-shadow:var(--shadow-md); }
  .p-card:active{ transform:scale(0.98); }
  .p-thumb{ width:100%; aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:linear-gradient(135deg,var(--tealsoft),var(--paper)); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); margin-bottom:11px; }
  .p-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .p-thumb svg{ width:28px; height:28px; opacity:0.4; }
  .p-card .cat{ display:inline-block; font-size:10.5px; color:var(--teal-light); background:var(--tealsoft); padding:2px 9px; border-radius:999px; margin-bottom:7px; }
  .p-card .nm{ font-size:14px; font-weight:600; margin-bottom:8px; min-height:36px; line-height:1.3; color:var(--ink); }
  .p-card .pr{ font-family:var(--font-display); font-size:18px; color:var(--gold); font-weight:600; letter-spacing:-0.01em; }
  .p-card .pr .u{ font-family:"IBM Plex Sans Thai",sans-serif; font-size:11px; color:var(--muted); font-weight:400; }
  .p-card .st{ font-size:11px; color:var(--muted); margin-top:4px; }

  .cart-panel{ background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow-md); position:sticky; top:96px; max-height:calc(100vh - 116px); display:flex; flex-direction:column; overflow:hidden; }
  .cart-summary-bar{ display:none; }
  .cart-head{ padding:16px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:linear-gradient(180deg,var(--tealsoft),transparent); }
  .seller-fields{ padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:8px; }
  .seller-fields input{ flex:1 1 0; min-width:0; padding:8px 11px; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink); font-size:12.5px; }
  .seller-fields input:focus{ outline:none; border-color:var(--teal-light); box-shadow:0 0 0 3px rgba(23,105,95,0.18); background:var(--surface); }
  .cart-items{ overflow-y:auto; flex:1 1 auto; padding:6px 14px; }
  .cart-row{ display:flex; align-items:center; gap:8px; padding:12px 4px; border-bottom:1px dashed var(--line); }
  .cart-row:last-child{ border-bottom:none; }
  .cart-row .ci-name{ flex:1 1 auto; font-size:13.5px; font-weight:500; line-height:1.3; }
  .cart-row .ci-name .p{ font-size:11.5px; color:var(--muted); font-weight:400; margin-top:2px; }
  .cart-foot{ padding:16px 18px; border-top:1px solid var(--line); background:var(--paper); }
  .cart-total{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .cart-total .lbl{ font-size:13px; color:var(--muted); }
  .cart-total .val{ font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--teal); letter-spacing:-0.02em; }
  @media (prefers-color-scheme: dark){ .cart-total .val{ color:var(--gold); } }
  :root[data-theme="dark"] .cart-total .val{ color:var(--gold); }
  .cart-profit-hint{ font-size:12px; color:var(--sage); margin-bottom:12px; font-weight:500; }

  /* ---- modal ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(6,20,17,0.55); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50; animation:fadein .15s ease; }
  .modal-overlay.sheet-overlay{ align-items:flex-end; padding:0; }
  .modal{ background:var(--surface); border-radius:22px; width:100%; max-width:460px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.5); animation:popin .18s ease; }
  .modal.wide{ max-width:420px; }

/* v3.2 soft fading top bar */
.topbar, .topbar:where(*){ background:transparent !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important; isolation:isolate; }
.topbar::before{ content:""; position:absolute; left:0; right:0; top:0; bottom:-26px; z-index:-1; pointer-events:none;
  background:linear-gradient(to bottom, rgba(232,235,241,.94) 0%, rgba(232,235,241,.78) 55%, rgba(232,235,241,0) 100%);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 100%); mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 100%); }
:root[data-theme="dark"] .topbar::before{ background:linear-gradient(to bottom, rgba(20,22,28,.94) 0%, rgba(20,22,28,.78) 55%, rgba(20,22,28,0) 100%); }
/* tables fit the phone screen — no sideways scrolling */
@media (max-width:820px){
  .table-scroll{ overflow-x:visible; }
  .table-scroll table{ width:100%; table-layout:auto; }
  thead th{ padding:9px 6px; font-size:11.5px; white-space:normal; line-height:1.25; }
  tbody td{ padding:11px 6px; font-size:13px; word-break:break-word; }
  .table-scroll th:first-child, .table-scroll td:first-child{ padding-left:14px; }
  .table-scroll th:last-child, .table-scroll td:last-child{ padding-right:14px; }
  .table-scroll td.num, .table-scroll td.mono{ white-space:nowrap; word-break:normal; }
  .table-scroll .tag{ font-size:11px; padding:3px 8px; white-space:nowrap; }
  .table-scroll .btn.small.icon-only{ padding:6px; }
  .table-scroll td.num .btn + .btn{ margin-top:4px; }
}

.mobile-only{ display:none; }
@media (max-width:820px){
  .mobile-only{ display:block; }
  #btnLogout{ display:none; }
  table.rt, table.rt tbody{ display:block; width:100%; }
  table.rt thead{ display:none; }
  table.rt tr{ display:block; position:relative; margin:0 12px 12px; padding:6px 14px; background:var(--paper); border-radius:20px; border:none; }
  table.rt tbody tr:hover{ background:var(--paper); }
  table.rt td{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0 !important; border-bottom:1px solid var(--line); font-size:14px; text-align:right; white-space:normal; }
  table.rt td:last-child{ border-bottom:none; }
  table.rt td[data-label]::before{ content:attr(data-label); font-size:12px; color:var(--muted); font-weight:600; text-align:left; flex:0 0 auto; }
  table.rt.rt-stock td:first-child::before{ display:none; }
  table.rt td:first-child{ justify-content:flex-start; text-align:left; }
  table.rt.rt-rcpt td.ck{ position:absolute; right:12px; top:10px; padding:0 !important; border:none; width:auto; }
  table.rt.rt-rcpt td.ck + td{ justify-content:flex-start; padding-right:40px !important; }
  table.rt .qty-edit input{ width:84px !important; }
  table.rt td:last-child{ justify-content:flex-end; }
  table.rt td:last-child::before{ margin-right:auto; }
  .table-scroll:has(table.rt){ padding:4px 0 8px; }
}

/* stop iOS auto-zoom when focusing inputs (needs >=16px) */
@media (max-width:820px){
  input, select, textarea, .cart-qty-input, .qty-edit input{ font-size:16px !important; }
}
html{ -webkit-text-size-adjust:100%; touch-action:manipulation; }
</style>

}

/* ================= STATE ================= */
/* ข้อมูลร้าน (สินค้า ราคา ใบเสร็จ ตั้งค่า) อยู่บนเซิร์ฟเวอร์ Supabase ทุกเครื่องเห็นชุดเดียวกัน
   ในเครื่องเก็บเฉพาะตะกร้าที่ยังไม่ได้บันทึกและสถานะหน้าจอ */
const LEGACY_KEY = 'scrapShopBackofficeState_v1';

function seedMaterials(){
  return [
    {id:'m1', name:'เหล็กหนา', sku:'MTL-001', category:'โลหะ', unit:'กก.', buyPrice:8, sellPrice:11, stock:210, image:null},
    {id:'m2', name:'เหล็กบาง / สังกะสี', sku:'MTL-002', category:'โลหะ', unit:'กก.', buyPrice:5, sellPrice:7.5, stock:95, image:null},
    {id:'m3', name:'ทองแดง', sku:'MTL-010', category:'โลหะ', unit:'กก.', buyPrice:220, sellPrice:262, stock:18.4, image:null},
    {id:'m4', name:'ทองเหลือง', sku:'MTL-011', category:'โลหะ', unit:'กก.', buyPrice:110, sellPrice:136, stock:9.2, image:null},
    {id:'m5', name:'อลูมิเนียม', sku:'MTL-020', category:'โลหะ', unit:'กก.', buyPrice:45, sellPrice:58, stock:33.5, image:null},
    {id:'m6', name:'กระป๋องอลูมิเนียม', sku:'MTL-021', category:'โลหะ', unit:'กก.', buyPrice:38, sellPrice:50, stock:22.1, image:null},
    {id:'m7', name:'สายไฟ / ทองแดงหุ้ม', sku:'MTL-030', category:'โลหะ', unit:'กก.', buyPrice:60, sellPrice:82, stock:14.8, image:null},

    {id:'m9', name:'กระดาษขาว / หนังสือพิมพ์', sku:'PPR-002', category:'กระดาษ', unit:'กก.', buyPrice:6, sellPrice:9, stock:58, image:null},
    {id:'m10', name:'ขวดพลาสติก PET', sku:'PLS-001', category:'พลาสติก', unit:'กก.', buyPrice:8, sellPrice:12.5, stock:47, image:null},
    {id:'m11', name:'ขวดแก้ว', sku:'GLS-001', category:'แก้ว', unit:'กก.', buyPrice:1, sellPrice:2, stock:88, image:null},
    {id:'m12', name:'แบตเตอรี่รถยนต์เก่า', sku:'ELC-001', category:'อิเล็กทรอนิกส์', unit:'ลูก', buyPrice:250, sellPrice:320, stock:6, image:null},
  ];
}

function defaultShop(){
  return { name:'ร้านรับซื้อของเก่า', address:'', phone:'', taxId:'', note:'ขอบคุณที่ใช้บริการ', highStockAlert:150, logo:null, logoSize:100, logoOffset:38, shopNameFont:'Taviraj', totalFont:'Taviraj', autoPrint:true, paperWidth:80 };
}

  return [
    { id:uid('oh'), name:'ค่าแรงพนักงาน', amount:9000, frequency:'monthly', date:null },
    { id:uid('oh'), name:'ค่าน้ำมันรถขนของ', amount:150, frequency:'daily', date:null },
    { id:uid('oh'), name:'ค่าไฟฟ้าร้าน', amount:1200, frequency:'monthly', date:null },
  ];
}
function defaultUi(){
  return { tab:'dashboard', stockQ:'', posQ:'', posCat:'ทั้งหมด', sellQ:'', sellCat:'ทั้งหมด', dashPeriod:'day', historyTab:'buy' };
}
function emptyState(){
  return {
    shop: defaultShop(), shopExists:false,
    materials:[], purchases:[], sales:[], overheadCosts:[],
    nextReceiptNo:1, nextSaleNo:1,
    cart:[], sellCart:[],
    ui: defaultUi()
  };
}

let state = emptyState();
let selectedReceiptIds = new Set();
let sb = null, session = null, profile = null;
const txIds = { buy:null, sell:null };   // Supabase client / session / โปรไฟล์ (role)

function isAdmin(){ return !!(profile && profile.role === 'admin'); }
function localKey(){ return 'spd_local_v2_' + (session ? session.user.id : 'anon'); }
function loadLocalUi(){
  try{
    const raw = localStorage.getItem(localKey());
    if(!raw) return;
    const p = JSON.parse(raw);
    if(Array.isArray(p.cart)) state.cart = p.cart;
    if(Array.isArray(p.sellCart)) state.sellCart = p.sellCart;
    if(p.ui) state.ui = Object.assign(defaultUi(), p.ui);
  }catch(e){ console.error('local load error', e); }
}
function saveState(){
  try{ localStorage.setItem(localKey(), JSON.stringify({ cart:state.cart, sellCart:state.sellCart, ui:state.ui })); }
  catch(e){ console.error('save error', e); }
  scheduleSync();   // admin: ส่งการแก้ไขขึ้นเซิร์ฟเวอร์ (พนักงานไม่มีสิทธิ์ จึงไม่ส่ง)
}
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }


/* ================= HELPERS ================= */
function money(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function moneySigned(n){ n=Number(n||0); return (n<0?'-':'') + '฿' + money(Math.abs(n)); }
function formatQty(n){ n = Number(n||0); return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,'').replace(/\.$/,''); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function startOfWeek(d){ const x=startOfDay(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function startOfMonth(d){ const x=startOfDay(d); x.setDate(1); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
function isToday(iso){
  const d = new Date(iso), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getMaterial(id){ return state.materials.find(m=>m.id===id); }

function toast(msg, type){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err' ? ' err' : '');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);
}

/* ================= RENDER SHELL ================= */
const TABS = [
  {id:'dashboard', label:'แดชบอร์ด', icon:'chart'},
  {id:'stock', label:'ประเภทของเก่า', icon:'box'},
  {id:'pos', label:'รับซื้อของ', icon:'scale'},
  {id:'sell', label:'ขายของ', icon:'tag'},
  {id:'receipts', label:'ประวัติ', icon:'receipt'},
  {id:'settings', label:'ตั้งค่าร้าน', icon:'settings'},
];

const STAFF_TABS = ['pos','sell','receipts'];
function allowedTabs(){ return isAdmin() ? TABS : TABS.filter(t=>STAFF_TABS.includes(t.id)); }

function render(){
  const app = document.getElementById('app');
  const tabs = allowedTabs();
  if(!tabs.some(t=>t.id===state.ui.tab)) state.ui.tab = tabs[0].id;
  const tabMeta = tabs.find(t=>t.id===state.ui.tab) || tabs[0];
  const todayPurchases = state.purchases.filter(p=>isToday(p.date));
  const todayProfit = todayPurchases.reduce((a,p)=>a+(p.totalProfit||0),0);

  app.innerHTML = `
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark ${state.shop.logo?'has-logo':''}">${state.shop.logo ? `<img src="${state.shop.logo}" alt="โลโก้ร้าน">` : esc((state.shop.name||'ร').trim()[0]||'ร')}</div>
        <div class="brand-text">
          <div class="name">${esc(state.shop.name || 'ร้านรับซื้อของเก่า')}</div>
          <div class="sub">ระบบหลังร้าน</div>
        </div>
      </div>
      <nav class="tabs">
        ${tabs.map(t=>`
          <button class="tab-btn ${t.id===state.ui.tab?'active':''}" data-tab="${t.id}">
            ${ic(t.icon)}<span>${t.label}</span>
          </button>`).join('')}
      </nav>
      <div class="sidebar-foot">ผู้ใช้: ${esc(profile ? profile.username : '')} · ${roleLabel(profile ? profile.role : '')}<br>ข้อมูลซิงก์กับเซิร์ฟเวอร์ทุกเครื่อง</div>
    </aside>
    <div class="main">
      <div class="topbar">
        <h1>${tabMeta.label}</h1>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          ${isAdmin()
            ? `<div class="stat">กำไรขั้นต้นวันนี้ <b class="${todayProfit<0?'loss':'profit'}">${plMoney(todayProfit)}</b> · ${todayPurchases.length} รายการรับซื้อ</div>`
            : `<div class="stat">${esc(profile ? profile.username : '')} · รับซื้อวันนี้ <b>${todayPurchases.length}</b> รายการ</div>`}
          <button class="btn small" id="btnLogout" title="ออกจากระบบ">ออกจากระบบ</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
    <nav class="bottom-nav">
      ${tabs.map(t=>`
        <button class="bn-btn ${t.id===state.ui.tab?'active':''}" data-tab="${t.id}">
          ${ic(t.icon)}<span>${t.label}</span>
        </button>`).join('')}
    </nav>
  `;
  app.querySelectorAll('.tab-btn, .bn-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ state.ui.tab = b.dataset.tab; saveState(); render(); });
  });
  const btnLogout = document.getElementById('btnLogout');
  if(btnLogout) btnLogout.onclick = logout;
  renderContent();
}

function labelTables(root){
  root.querySelectorAll('table.rt').forEach(t=>{
    const heads=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{ if(heads[i] && !td.classList.contains('ck')) td.setAttribute('data-label',heads[i]); });
    });
  });
}
function renderContent(){
  const c = document.getElementById('content');
  if(!allowedTabs().some(t=>t.id===state.ui.tab)){ render(); return; }
  if(state.ui.tab==='dashboard') c.innerHTML = viewDashboard();
  else if(state.ui.tab==='stock') c.innerHTML = viewStock();
  else if(state.ui.tab==='pos') c.innerHTML = viewPOS();
  else if(state.ui.tab==='sell') c.innerHTML = viewSell();
  else if(state.ui.tab==='receipts') c.innerHTML = viewReceipts();
  else if(state.ui.tab==='settings') c.innerHTML = viewSettings();
  const cartShowing = (state.ui.tab==='pos' && state.cart.length>0) || (state.ui.tab==='sell' && state.sellCart.length>0);
  c.classList.toggle('has-cart-bar', cartShowing);
  labelTables(c);
  bindContentEvents();
  const chartCols = c.querySelector('.chart-cols'); if(chartCols) chartCols.scrollLeft = chartCols.scrollWidth;

/* ================= DASHBOARD (profit) ================= */
function purchasesInRange(start, end){
  return state.purchases.filter(p=>{ const d = new Date(p.date); return d>=start && d<end; });
}
function sumProfit(list){ return list.reduce((a,p)=>a+p.totalProfit,0); }
function sumCost(list){ return list.reduce((a,p)=>a+p.totalCost,0); }
function sumWeight(list){ return list.reduce((a,p)=>a+p.items.reduce((s,i)=>s+i.qty,0),0); }

function buildBuckets(period){
  const today = new Date();
  const buckets = [];
  if(period==='day'){
    for(let i=13;i>=0;i--){
      const start = startOfDay(addDays(today,-i));
      const end = addDays(start,1);
      buckets.push({ start, end, label: start.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit'}), current: i===0 });
    }
  }else if(period==='week'){
    const thisWeekStart = startOfWeek(today);
    for(let i=7;i>=0;i--){
      const start = addDays(thisWeekStart, -7*i);
      const end = addDays(start,7);
      buckets.push({ start, end, label: start.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit'}), current: i===0 });
    }
  }else if(period==='month'){
    const thisMonthStart = startOfMonth(today);
    for(let i=5;i>=0;i--){
      const start = addMonths(thisMonthStart,-i);
      const end = addMonths(start,1);
      buckets.push({ start, end, label: start.toLocaleDateString('th-TH',{month:'short',year:'2-digit'}), current: i===0 });
    }
  }else{
    const thisYearStart = new Date(today.getFullYear(), 0, 1);
    for(let i=4;i>=0;i--){
      const start = new Date(thisYearStart.getFullYear()-i, 0, 1);
      const end = new Date(thisYearStart.getFullYear()-i+1, 0, 1);
      buckets.push({ start, end, label: start.toLocaleDateString('th-TH',{year:'numeric'}), current: i===0 });
    }
  }
  return buckets.map(b=>{
    const list = purchasesInRange(b.start, b.end);
    const profit = sumProfit(list);
    const overhead = overheadForRange(b.start, b.end);
    return { ...b, profit, overhead, net: profit - overhead, cost: sumCost(list), weight: sumWeight(list), count: list.length, list };
  });
}
function breakdownByMaterial(list){
  const map = {};
  list.forEach(p=> p.items.forEach(i=>{
    if(!map[i.name]) map[i.name] = { name:i.name, unit:i.unit, qty:0, cost:0, profit:0 };
    map[i.name].qty += i.qty; map[i.name].cost += i.cost; map[i.name].profit += i.profit;
  }));
  return Object.values(map).sort((a,b)=>b.profit-a.profit);
}
const PERIOD_LABEL = { day:'วันนี้', week:'สัปดาห์นี้', month:'เดือนนี้', year:'ปีนี้' };

function getDashboardData(period){
  const buckets = buildBuckets(period);
  const current = buckets[buckets.length-1];
  const maxAbs = Math.max(1, ...buckets.map(b=>Math.abs(b.net)));
  const breakdown = breakdownByMaterial(current.list);
  const todayPurchases = purchasesInRange(startOfDay(new Date()), addDays(startOfDay(new Date()),1));
  const totalStockValue = state.materials.reduce((a,m)=>a+m.buyPrice*m.stock,0);
  const highStock = state.materials.filter(m=>m.stock>=state.shop.highStockAlert).sort((a,b)=>b.stock-a.stock);
  const overhead = overheadForRange(current.start, current.end);
  const netProfit = current.profit - overhead;
  const prev = buckets.length > 1 ? buckets[buckets.length-2] : null;
  const salesList = state.sales.filter(x=>{ const d=new Date(x.date); return d>=current.start && d<current.end; });
  const salesTotal = salesList.reduce((a,x)=>a+x.totalAmount,0);
  return { buckets, current, prev, maxAbs, breakdown, todayPurchases, totalStockValue, highStock, overhead, netProfit, salesList, salesTotal };
}

const PREV_LABEL = { day:'เมื่อวาน', week:'สัปดาห์ก่อน', month:'เดือนก่อน', year:'ปีก่อน' };
function plClass(n){ return n<0 ? 'pl-down' : 'pl-up'; }
function plMoney(n){ n=Number(n||0); return (n<0?'−':'+')+'฿'+money(Math.abs(n)); }
function shortMoney(n){
  const a = Math.abs(n), sign = n<0?'−':'';
  if(a>=1000000) return sign+(a/1000000).toFixed(1)+'M';
  if(a>=1000) return sign+(a/1000).toFixed(1)+'k';
  return sign+String(Math.round(a));
}
const MIX_COLORS = ['#0B4DDB','#C6EE17','#1B1E25','#9DB6F7','#B9C0CC','#7C8AA5'];

function chartHTML(buckets, maxAbs){
  const hasNeg = buckets.some(b=>b.net<0);
  const POS_H = hasNeg ? 120 : 190, NEG_H = hasNeg ? 96 : 0;
  const maxPos = Math.max(1, ...buckets.map(b=>Math.max(0,b.net)));
  const maxNeg = Math.max(1, ...buckets.map(b=>Math.max(0,-b.net)));
  return `<div class="chart-cols">` + buckets.map(b=>{
    const pos = b.net>0 ? Math.max(8, Math.round(b.net/maxPos*(POS_H-26))) : 0;
    const neg = b.net<0 ? Math.max(8, Math.round(-b.net/maxNeg*(NEG_H-34))) : 0;
    const pill = b.current ? `<div class="cc-pill ${b.net<0?'loss':''}" style="top:${b.net<0?(neg+6):(POS_H-pos-30)}px;">${b.net<0?'ขาดทุน ':'กำไร '}฿${shortMoney(Math.abs(b.net))}</div>` : '';
    return `
      <div class="cc ${b.current?'current':''}" title="${esc(b.label)}: ${plMoney(b.net)}">
        <div class="cc-pos" style="height:${POS_H}px;">
          ${b.net>0 ? `<div class="cc-bar pos" style="height:${pos}px;"></div>` : ''}
          ${b.net>=0 ? pill : ''}
        </div>
        ${hasNeg ? `<div class="cc-zero"></div><div class="cc-neg" style="height:${NEG_H}px;">
          ${b.net<0 ? `<div class="cc-bar neg" style="height:${neg}px;"></div>` : ''}
          ${b.net<0 ? pill : ''}
        </div>` : ''}
        <div class="cc-label">${esc(b.label)}</div>
        <div class="cc-val ${plClass(b.net)}">${b.net===0?'0':(b.net<0?'−':'+')+shortMoney(Math.abs(b.net))}</div>
      </div>`;
  }).join('') + `</div>`;
}

async function exportDashboardPDF(period){
  const btn = document.getElementById('btnExportDashboardPDF');
  if(btn){ btn.disabled = true; btn.textContent = 'กำลังสร้างไฟล์...'; }
  try{
    if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
    const wrapper = document.createElement('div');
    wrapper.style.position = 'fixed';
    wrapper.style.left = '-9999px';
    wrapper.style.top = '0';
    wrapper.style.width = '794px';
    wrapper.innerHTML = dashboardReportHTML(period);
    document.body.appendChild(wrapper);
    const node = wrapper.firstElementChild;
    const canvas = await html2canvas(node, { scale:2, backgroundColor:'#ffffff', windowWidth:794 });
    document.body.removeChild(wrapper);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4' });
    const pageWidthMM = 210, pageHeightMM = 297;
    const imgHeightMM = pageWidthMM * canvas.height / canvas.width;
    const imgData = canvas.toDataURL('image/png');
    let heightLeftMM = imgHeightMM;
    let positionMM = 0;
    pdf.addImage(imgData, 'PNG', 0, positionMM, pageWidthMM, imgHeightMM);
    heightLeftMM -= pageHeightMM;
    while(heightLeftMM > 0){
      positionMM -= pageHeightMM;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, positionMM, pageWidthMM, imgHeightMM);
      heightLeftMM -= pageHeightMM;
    }
    const stamp = new Date().toISOString().slice(0,10);
    pdf.save(`รายงานกำไร-${period}-${stamp}.pdf`);
    toast('ดาวน์โหลดรายงาน PDF แล้ว');
  }catch(e){
    console.error(e);
    toast('สร้างรายงาน PDF ไม่สำเร็จ ลองอีกครั้ง','err');
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = ic('download') + ' Export PDF'; }
  }
}

function compressImage(file, onDone, onError){
  const reader = new FileReader();
  reader.onerror = ()=> onError && onError();
  reader.onload = (e)=>{
    const img = new Image();
    img.onerror = ()=> onError && onError();
    img.onload = ()=>{
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      onDone(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function addToCart(mode, mid, qty){
  qty = qty || 1;
  const m = getMaterial(mid); if(!m) return;
  const cart = cartArray(mode);
  const row = cart.find(c=>c.materialId===mid);
  if(mode==='sell'){
    const current = row ? row.qty : 0;
    if(current+qty > m.stock){ toast('สต๊อกไม่พอ','err'); return; }
  }
  if(row){ row.qty = Number((row.qty + qty).toFixed(3)); }
  else cart.push({materialId:mid, qty});
  saveState(); renderContent(); refreshCartSheetIfOpen(mode);
}
function changeCartQty(mode, mid, delta){
  const cart = cartArray(mode);
  const row = cart.find(c=>c.materialId===mid);
  if(!row) return;
  const m = getMaterial(mid);
  const next = Number((row.qty + delta).toFixed(2));
  if(next <= 0){ setCartArray(mode, cart.filter(c=>c.materialId!==mid)); }
  else{
    if(mode==='sell' && m && next > m.stock){ toast('สต๊อกไม่พอ','err'); return; }
    row.qty = next;
  }
  saveState(); renderContent(); refreshCartSheetIfOpen(mode);
}
function setCartQty(mode, mid, rawValue){
  const cart = cartArray(mode);
  const row = cart.find(c=>c.materialId===mid);
  if(!row) return;
  const m = getMaterial(mid);
  const v = parseFloat(rawValue);
  if(isNaN(v) || v<=0){ setCartArray(mode, cart.filter(c=>c.materialId!==mid)); saveState(); renderContent(); refreshCartSheetIfOpen(mode); return; }
  if(mode==='sell' && m && v > m.stock){ toast('สต๊อกไม่พอ ปรับเป็นจำนวนคงเหลือสูงสุดแล้ว','err'); row.qty = m.stock; }
  else row.qty = v;
  saveState(); renderContent(); refreshCartSheetIfOpen(mode);
}
function removeFromCart(mode, mid){
  setCartArray(mode, cartArray(mode).filter(x=>x.materialId!==mid));
  saveState(); renderContent(); refreshCartSheetIfOpen(mode);
}
function clearCartAction(mode){
  setCartArray(mode, []);
  saveState(); renderContent(); refreshCartSheetIfOpen(mode);
}

function bindCartEvents(container){
  container.querySelectorAll('[data-cart-inc]').forEach(b=> b.onclick = ()=> changeCartQty(b.dataset.cartMode||'buy', b.dataset.cartInc, 1));
  container.querySelectorAll('[data-cart-dec]').forEach(b=> b.onclick = ()=> changeCartQty(b.dataset.cartMode||'buy', b.dataset.cartDec, -1));
  container.querySelectorAll('[data-cart-qty]').forEach(inp=>{
    inp.addEventListener('change', ()=> setCartQty(inp.dataset.cartMode||'buy', inp.dataset.cartQty, inp.value));
  });
  container.querySelectorAll('[data-cart-remove]').forEach(b=> b.onclick = ()=> removeFromCart(b.dataset.cartMode||'buy', b.dataset.cartRemove));
}

function refreshCartSheetIfOpen(mode){

function lastOf(list, id){ return list.find(x=>x.id===id); }

async function checkout(sellerNameArg, sellerPhoneArg){
  if(!state.cart.length || txBusy) return;
  const sellerName = sellerNameArg != null ? sellerNameArg : (document.getElementById('sellerName') ? document.getElementById('sellerName').value.trim() : '');
  const sellerPhone = sellerPhoneArg != null ? sellerPhoneArg : (document.getElementById('sellerPhone') ? document.getElementById('sellerPhone').value.trim() : '');
  const items = state.cart.map(c=>{
    const m = getMaterial(c.materialId);
    const cost = Number((m.buyPrice*c.qty).toFixed(2));
    const profit = Number(((m.sellPrice-m.buyPrice)*c.qty).toFixed(2));
    return { mid:m.id, name:m.name, sku:m.sku, unit:m.unit, qty:c.qty, buyPrice:m.buyPrice, sellPrice:m.sellPrice, cost, profit };
  });
  const totalCost = Number(items.reduce((a,i)=>a+i.cost,0).toFixed(2));
  const totalProfit = Number(items.reduce((a,i)=>a+i.profit,0).toFixed(2));
  // id คงเดิมตลอดการลองซ้ำ ถ้าเน็ตหลุดหลังบันทึกไปแล้ว กดอีกครั้งจะไม่เกิดใบซ้ำ
  const sig = JSON.stringify(items.map(i=>[i.mid,i.qty]));
  if(!txIds.buy || txIds.buy.sig!==sig) txIds.buy = { id:uid('pu'), date:new Date().toISOString(), sig };
  const doc = { id:txIds.buy.id, date:txIds.buy.date, sellerName, sellerPhone, items, totalCost, totalProfit };
  txBusy = true;
  const { error } = await sb.rpc('record_purchase', { doc });
  txBusy = false;
  if(error && error.code !== '23505'){ toast('บันทึกไม่สำเร็จ: '+friendlyErr(error),'err'); return; }
  txIds.buy = null;
  state.cart = [];
  saveState();
  await pullAll(true);
  renderContent();
  const purchase = lastOf(state.purchases, doc.id);
  toast('บันทึกรายการรับซื้อแล้ว');
  if(purchase){
    openReceiptModal(purchase.id);
    if(state.shop.autoPrint) printReceiptNow(receiptHTML(purchase));
  }
}

async function sellCheckout(buyerNameArg, buyerPhoneArg){
  if(!state.sellCart.length || txBusy) return;
  for(const c of state.sellCart){
    const m = getMaterial(c.materialId);
    if(!m || c.qty > m.stock){ toast(`สต๊อกไม่พอสำหรับ ${m?m.name:'สินค้า'}`,'err'); return; }
  }
  const buyerName = buyerNameArg != null ? buyerNameArg : (document.getElementById('buyerName') ? document.getElementById('buyerName').value.trim() : '');
  const buyerPhone = buyerPhoneArg != null ? buyerPhoneArg : (document.getElementById('buyerPhone') ? document.getElementById('buyerPhone').value.trim() : '');
  const items = state.sellCart.map(c=>{
    const m = getMaterial(c.materialId);
    const amount = Number((m.sellPrice*c.qty).toFixed(2));
    return { mid:m.id, name:m.name, sku:m.sku, unit:m.unit, qty:c.qty, sellPrice:m.sellPrice, amount };
  });
  const totalAmount = Number(items.reduce((a,i)=>a+i.amount,0).toFixed(2));
  const sig = JSON.stringify(items.map(i=>[i.mid,i.qty]));
  if(!txIds.sell || txIds.sell.sig!==sig) txIds.sell = { id:uid('sl'), date:new Date().toISOString(), sig };
  const doc = { id:txIds.sell.id, date:txIds.sell.date, buyerName, buyerPhone, items, totalAmount };
  txBusy = true;
  const { error } = await sb.rpc('record_sale', { doc });
  txBusy = false;
  if(error && error.code !== '23505'){
    toast('บันทึกไม่สำเร็จ: '+friendlyErr(error),'err');
    if(/insufficient stock/i.test(error.message||'')){ await pullAll(true); renderContent(); }
    return;
  }
  txIds.sell = null;
  state.sellCart = [];
  saveState();
  await pullAll(true);
  renderContent();
  const sale = lastOf(state.sales, doc.id);
  toast('บันทึกการขายแล้ว รับเงิน ฿'+money(totalAmount));
  if(sale){
    openSaleReceiptModal(sale.id);
    if(state.shop.autoPrint) printReceiptNow(saleReceiptHTML(sale));
  }
}

/* ================= OVERHEAD / HIDDEN COSTS (ต้นทุนแฝง) ================= */
function dailyRateOf(o){
  if(o.frequency==='daily') return o.amount;
  if(o.frequency==='monthly') return o.amount/30;
  if(o.frequency==='yearly') return o.amount/365;
  return 0; // 'once' handled separately by exact date
}
function overheadForRange(start, end){
  const days = Math.max(0, Math.round((end-start)/86400000));
  let total = 0;
  state.overheadCosts.forEach(o=>{
    if(o.frequency==='once'){
      if(o.date){ const d = new Date(o.date); if(d>=start && d<end) total += o.amount; }
    }else{
      total += dailyRateOf(o) * days;
    }
  });
  return total;
}
const FREQ_LABEL = { daily:'รายวัน', monthly:'รายเดือน', yearly:'รายปี', once:'ครั้งเดียว' };

          <option value="yearly" ${editing&&editing.frequency==='yearly'?'selected':''}>รายปี</option>
          <option value="once" ${editing&&editing.frequency==='once'?'selected':''}>ครั้งเดียว (ระบุวันที่)</option>
        </select>
      </div>
    </div>
    <div class="field" id="fOhDateWrap" style="${editing&&editing.frequency==='once'?'':'display:none;'}">
      <label>วันที่จ่าย</label><input id="fOhDate" type="date" value="${editing&&editing.date?editing.date.slice(0,10):''}">
    </div>
    <div class="field-hint">รายการแบบรายเดือน/รายปีจะถูกคิดเฉลี่ยเป็นรายวันในการคำนวณกำไรสุทธิ</div>
  `;
  openModal(editing?'แก้ไขต้นทุนแฝง':'เพิ่มต้นทุนแฝง', body, `
    <button class="btn ghost" id="mCancel">ยกเลิก</button>

    if(!name){ toast('กรุณากรอกชื่อค่าใช้จ่าย','err'); return; }

    if(frequency==='once' && !dateVal){ toast('กรุณาเลือกวันที่','err'); return; }

    if(editing){ Object.assign(editing, {name, amount, frequency, date}); toast('แก้ไขแล้ว'); }
    else{ state.overheadCosts.push({ id:uid('oh'), name, amount, frequency, date }); toast('เพิ่มต้นทุนแฝงแล้ว'); }
    saveState(); closeModal(); renderContent();
  };
}
function deleteOverheadConfirm(id){

async function renderAnyReceiptCanvas(html){
  if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-9999px';
  wrapper.style.top = '0';
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper);
  const node = wrapper.firstElementChild;
  const canvas = await html2canvas(node, { scale: 2.5, backgroundColor: '#ffffff' });
  document.body.removeChild(wrapper);
  return canvas;
}

  });
}

function compressImageToPNG(file, onDone, onError){
  const reader = new FileReader();
  reader.onerror = ()=> onError && onError();
  reader.onload = (e)=>{
    const img = new Image();
    img.onerror = ()=> onError && onError();
    img.onload = ()=>{
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else{ w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      onDone(canvas.toDataURL('image/png'));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ================= MODAL ================= */
function openModal(title, bodyHTML, footHTML, variant){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay' + (variant==='sheet' ? ' sheet-overlay' : '');
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal ${variant==='wide'?'wide':''} ${variant==='sheet'?'sheet':''}">
      <div class="modal-head"><h3>${title}</h3><button class="x-btn" id="modalX">${ic('close')}</button></div>
      <div class="modal-body">${bodyHTML}</div>
      ${footHTML ? `<div class="modal-foot">${footHTML}</div>` : ''}
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('modalX').onclick = closeModal;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.addEventListener('keydown', escHandler);
}
function escHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const o = document.getElementById('modalOverlay');
  if(o) o.remove();
  document.removeEventListener('keydown', escHandler);
}

function bindContentEvents(){
  const c = document.getElementById('content');
  if(!c) return;

  // dashboard period tabs
  c.querySelectorAll('[data-period]').forEach(b=>{
    b.onclick = ()=>{ state.ui.dashPeriod = b.dataset.period; saveState(); renderContent(); };
  });
  const btnExportDashboardPDF = document.getElementById('btnExportDashboardPDF');
  if(btnExportDashboardPDF) btnExportDashboardPDF.onclick = ()=> exportDashboardPDF(state.ui.dashPeriod || 'day');

  if(state.ui.tab !== 'stock') window.__stockTyping = false;
  const lo2=document.getElementById('btnLogout2'); if(lo2) lo2.onclick=logout;
  // stock search
  const stockSearch = document.getElementById('stockSearch');
  if(stockSearch){
    stockSearch.addEventListener('input', ()=>{ state.ui.stockQ = stockSearch.value; window.__stockTyping = true; renderContent(); });
    // refocus only while the user is actively typing — never steal focus (pops up keyboard) on tab open
    if(window.__stockTyping){
      stockSearch.focus(); stockSearch.selectionStart = stockSearch.selectionEnd = stockSearch.value.length;
    }
  }
  const addBtn = document.getElementById('btnAddProduct');
  if(addBtn) addBtn.onclick = ()=> openProductModal(null);

/* วางค่าจาก Supabase > Project Settings > API ตรงนี้ หรือปล่อยว่างแล้วกรอกในหน้าตั้งค่าครั้งแรกของแต่ละเครื่อง
   (anon key เป็นกุญแจสาธารณะ ออกแบบให้อยู่ในหน้าเว็บได้ ความปลอดภัยอยู่ที่กฎ RLS ใน supabase/schema.sql) */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
const CFG_KEY = 'spd_supabase_cfg_v1';
const POLL_MS = 15000;
const EMAIL_DOMAIN = 'gmail.com';   // Supabase ล็อกอินด้วยอีเมล และปฏิเสธโดเมนที่ไม่มีอยู่จริง จึงแปลงชื่อผู้ใช้เป็น spd.<ชื่อ>@gmail.com (ไม่มีการส่งเมลจริง)

function getCfg(){
  if(SUPABASE_URL && SUPABASE_ANON_KEY) return { url:SUPABASE_URL, key:SUPABASE_ANON_KEY };
  try{
    const c = JSON.parse(localStorage.getItem(CFG_KEY));
    if(c && c.url && c.key && !isSecretKey(c.key)) return c;
  }catch(e){}
  return null;
}
function isSecretKey(k){
  if(/^sb_secret_/i.test(k)) return true;
  try{
    const part = k.split('.')[1];
    if(part){ const p = JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/'))); if(p && p.role === 'service_role') return true; }
  }catch(e){}
  return false;
}
function resetCfg(){ try{ localStorage.removeItem(CFG_KEY); }catch(e){} location.reload(); }
function userEmail(u){ return 'spd.' + u + '@' + EMAIL_DOMAIN; }
function roleLabel(r){ return ({ admin:'ผู้ดูแล (admin)', staff:'พนักงาน', pending:'รออนุมัติ', disabled:'ถูกระงับ' })[r] || r; }
function friendlyErr(e){
  const m = (e && e.message) ? e.message : String(e);
  if(/email.*invalid|invalid.*email/i.test(m)) return 'Supabase ไม่ยอมรับอีเมลภายใน ('+m+') แจ้งผู้พัฒนา';
  if(/secret api key in browser/i.test(m)) return 'ใส่ secret key ผิดตัว กดลิงก์ "เปลี่ยนการเชื่อมต่อเซิร์ฟเวอร์" แล้วใช้ anon / Publishable key แทน';
  if(/insufficient stock/i.test(m)) return 'สต๊อกไม่พอ';
  if(/no permission|row-level security|permission denied/i.test(m)) return 'ไม่มีสิทธิ์ทำรายการนี้';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'ออนไลน์ไม่ได้ ตรวจสอบอินเทอร์เน็ต';
  return m;
}
function must(p){ return p.then(r=>{ if(r.error) throw r.error; return r; }); }

/* ---------- เข้า/ออกระบบ ---------- */
async function initCloud(){
  const cfg = getCfg();
  if(!cfg){ renderSetup(); return; }
  if(!(window.supabase && window.supabase.createClient)){
    authShell(`<div class="auth-brand"><h1>โหลดไม่สำเร็จ</h1><div class="auth-sub">โหลดไลบรารี Supabase ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช</div></div>`);
    return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.key, { auth:{ persistSession:true, autoRefreshToken:true } });
  renderLoading('กำลังเชื่อมต่อ…');
  try{
    const { data } = await sb.auth.getSession();
    session = data.session;
  }catch(e){ session = null; }
  if(session) await enterApp(); else renderAuth();
}

async function enterApp(){
  stopPolling();
  renderLoading('กำลังโหลดข้อมูล…');
  let res;
  try{ res = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle(); }
  catch(e){ res = { error:e }; }
  if(res.error){
    authShell(`<div class="auth-brand"><h1>เชื่อมต่อไม่สำเร็จ</h1><div class="auth-sub">${esc(friendlyErr(res.error))}</div></div>
      <button class="btn primary" id="btnRetry" style="width:100%; justify-content:center; padding:11px; margin-bottom:8px;">ลองอีกครั้ง</button>
      <button class="btn" id="btnRetryLogout" style="width:100%; justify-content:center; padding:11px;">ออกจากระบบ</button>`);
    document.getElementById('btnRetry').onclick = enterApp;
    document.getElementById('btnRetryLogout').onclick = logout;
    return;
  }
  profile = res.data;
  if(!profile){ renderBlocked('ไม่พบข้อมูลผู้ใช้ในระบบ (ยังไม่ได้รัน schema.sql ใช่ไหม?)'); return; }
  if(profile.role === 'pending'){ renderPending(); return; }
  if(profile.role === 'disabled'){ renderBlocked('บัญชีนี้ถูกระงับโดยผู้ดูแลร้าน'); return; }

  state = emptyState();
  loadLocalUi();
  const ok = await pullAll(true);
  if(!ok){
    authShell(`<div class="auth-brand"><h1>โหลดข้อมูลไม่สำเร็จ</h1><div class="auth-sub">ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</div></div>
      <button class="btn primary" id="btnRetry" style="width:100%; justify-content:center; padding:11px; margin-bottom:8px;">ลองอีกครั้ง</button>
      <button class="btn" id="btnRetryLogout" style="width:100%; justify-content:center; padding:11px;">ออกจากระบบ</button>`);
    document.getElementById('btnRetry').onclick = enterApp;
    document.getElementById('btnRetryLogout').onclick = logout;
    return;
  }
  if(isAdmin() && !state.shopExists && state.materials.length === 0){
    render();
    openBootstrapModal();
  }else{
    render();
  }
  startPolling();
}

async function logout(){
  stopPolling();
  clearInterval(pendingRoleTimer);
  clearTimeout(syncTimer);
  try{ if(sb) await sb.auth.signOut(); }catch(e){}
  session = null; profile = null;
  state = emptyState();
  snap = { materials:{}, overheads:{}, shop:'' }; lastSig = '';
  authMode = 'login';
  renderAuth();
}

/* ---------- ดึงข้อมูลจากเซิร์ฟเวอร์ ---------- */
async function pullAll(force){
  if(!sb || !profile) return false;
  const admin = isAdmin();
  let res;
  try{
    res = await Promise.all([
      sb.from('shop_settings').select('data').eq('id', 1).maybeSingle(),
      sb.from('materials').select('id,data,stock').order('seq'),
      sb.from('purchases').select('data').order('no'),
      sb.from('sales').select('data').order('no'),
      admin ? sb.from('overheads').select('id,data') : Promise.resolve({ data:[], error:null }),
    ]);
  }catch(e){ console.error(e); if(force) toast('โหลดข้อมูลไม่สำเร็จ: '+friendlyErr(e),'err'); return false; }
  const bad = res.find(r=>r.error);
  if(bad){ console.error(bad.error); if(force) toast('โหลดข้อมูลไม่สำเร็จ: '+friendlyErr(bad.error),'err'); return false; }
  const sig = JSON.stringify(res.map(r=>r.data));
  if(!force && sig === lastSig) return false;
  lastSig = sig;
  const [st, mats, pur, sal, ovh] = res.map(r=>r.data);
  state.shopExists = !!st;
  state.shop = Object.assign(defaultShop(), st ? st.data : {});
  state.materials = (mats||[]).map(r=>Object.assign({}, r.data, { id:r.id, stock:Number(r.stock) }));
  state.purchases = (pur||[]).map(r=>r.data);
  state.sales = (sal||[]).map(r=>r.data);
  state.overheadCosts = (ovh||[]).map(r=>Object.assign({}, r.data, { id:r.id }));
  state.cart = state.cart.filter(c=>getMaterial(c.materialId));
  state.sellCart = state.sellCart.filter(c=>getMaterial(c.materialId));
  state.nextReceiptNo = state.purchases.length ? Math.max(...state.purchases.map(p=>p.no)) + 1 : 1;
  state.nextSaleNo = state.sales.length ? Math.max(...state.sales.map(s=>s.no)) + 1 : 1;
  snap = makeSnap();
  return true;
}

function matSplit(m){
  const rest = Object.assign({}, m); delete rest.id; delete rest.stock;
  return { d: JSON.stringify(rest), s: Number(m.stock) };
}
function ovhSplit(o){ const rest = Object.assign({}, o); delete rest.id; return JSON.stringify(rest); }
function makeSnap(){
  const s = { materials:{}, overheads:{}, shop: JSON.stringify(state.shop) };
  state.materials.forEach(m=>{ s.materials[m.id] = matSplit(m); });
  state.overheadCosts.forEach(o=>{ s.overheads[o.id] = ovhSplit(o); });
  return s;
}

/* ---------- ส่งการแก้ไขของ admin ขึ้นเซิร์ฟเวอร์ (เทียบกับที่ดึงมาล่าสุด) ---------- */
function scheduleSync(){
  if(!sb || !isAdmin()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{ syncTimer = null; syncPush(); }, 600);
}
async function syncPush(){
  if(!sb || !isAdmin()) return;
  if(syncBusy){ scheduleSync(); return; }
  syncBusy = true;
  try{
    // วัสดุ: ลบ / เพิ่ม / แก้ (แยกคอลัมน์ stock เพื่อไม่เขียนทับสต๊อกที่พนักงานเพิ่งขยับ)
    const cur = {};
    state.materials.forEach(m=>{ cur[m.id] = matSplit(m); });
    for(const id of Object.keys(snap.materials)){
      if(!cur[id]){ await must(sb.from('materials').delete().eq('id', id)); delete snap.materials[id]; }
    }
    for(const m of state.materials){
      const c = cur[m.id], o = snap.materials[m.id];
      if(!o){
        await must(sb.from('materials').insert({ id:m.id, data:JSON.parse(c.d), stock:c.s }));
      }else{
        const patch = {};
        if(o.d !== c.d) patch.data = JSON.parse(c.d);
        if(o.s !== c.s) patch.stock = c.s;
        if(Object.keys(patch).length){
          patch.updated_at = new Date().toISOString();
          await must(sb.from('materials').update(patch).eq('id', m.id));
        }
      }
      snap.materials[m.id] = c;
    }
    // ต้นทุนแฝง
    const curO = {};
    state.overheadCosts.forEach(o=>{ curO[o.id] = ovhSplit(o); });
    for(const id of Object.keys(snap.overheads)){
      if(!(id in curO)){ await must(sb.from('overheads').delete().eq('id', id)); delete snap.overheads[id]; }
    }
    for(const o of state.overheadCosts){
      if(snap.overheads[o.id] !== curO[o.id]){
        await must(sb.from('overheads').upsert({ id:o.id, data:JSON.parse(curO[o.id]) }));
        snap.overheads[o.id] = curO[o.id];
      }
    }
    // ตั้งค่าร้าน
    const shopStr = JSON.stringify(state.shop);
    if(shopStr !== snap.shop || !state.shopExists){
      await must(sb.from('shop_settings').upsert({ id:1, data:state.shop }));
      snap.shop = shopStr; state.shopExists = true;
    }
    lastSig = '';   // ให้รอบดึงถัดไปเทียบใหม่
  }catch(e){
    console.error(e);
    toast('บันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ: '+friendlyErr(e),'err');
    await pullAll(true);
    renderContent();
  }finally{
    syncBusy = false;
  }
}

/* ---------- ดึงข้อมูลใหม่เป็นระยะ ให้เครื่องอื่นเห็นการเปลี่ยนแปลง ---------- */
function startPolling(){
  stopPolling();
  document.addEventListener('input', markInput, true);
  pollTimer = setInterval(pollTick, POLL_MS);
  document.addEventListener('visibilitychange', onVisible);
}
function markInput(){ lastInputAt = Date.now(); }
function stopPolling(){
  clearInterval(pollTimer); pollTimer = null;
  document.removeEventListener('input', markInput, true);
  document.removeEventListener('visibilitychange', onVisible);
}
function onVisible(){ if(!document.hidden) pollTick(); }
async function pollTick(){
  if(!sb || !session || !profile || document.hidden) return;
  if(syncTimer || syncBusy || txBusy) return;
  if(document.getElementById('modalOverlay')) return;
  const ae = document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && Date.now() - lastInputAt < 5000) return;   // กำลังพิมพ์อยู่ ไม่รีเฟรชทับ
  try{
    const { data:p } = await sb.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
    if(p && p.role !== profile.role){ await enterApp(); return; }
  }catch(e){ return; }
  const changed = await pullAll(false);
  if(changed) render();
}

/* ---------- ตั้งต้นครั้งแรก (admin) ---------- */
function legacyState(){
  try{
    const raw = localStorage.getItem(LEGACY_KEY);
    if(!raw) return null;
    const p = JSON.parse(raw);
    return (p && Array.isArray(p.materials) && p.materials.length) ? p : null;
  }catch(e){ return null; }
}
function openBootstrapModal(){
  const old = legacyState();
  openModal('ตั้งต้นข้อมูลร้านบนเซิร์ฟเวอร์',
    `<p style="margin:0 0 12px; line-height:1.7;">เซิร์ฟเวอร์ยังว่างอยู่ เลือกวิธีเริ่มต้น</p>
     ${old ? `<p style="margin:0 0 12px; font-size:13px; color:var(--muted); line-height:1.7;">พบข้อมูลเดิมในเบราว์เซอร์เครื่องนี้: ${old.materials.length} ประเภทของเก่า, ใบรับซื้อ ${(old.purchases||[]).length} ใบ, ใบขาย ${(old.sales||[]).length} ใบ</p>` : ''}`,
    `${old ? `<button class="btn primary" id="bsLegacy">นำเข้าข้อมูลเดิม</button>` : ''}
     <button class="btn ${old?'':'primary'}" id="bsFresh">เริ่มใหม่ (มีประเภทของเก่าตัวอย่าง)</button>`);
  const lb = document.getElementById('bsLegacy');
  if(lb) lb.onclick = async ()=>{ lb.disabled = true; await importLegacy(old); };
  document.getElementById('bsFresh').onclick = async ()=>{
    document.getElementById('bsFresh').disabled = true;
    state.materials = seedMaterials();
    state.overheadCosts = defaultOverheads();
    state.shopExists = false;
    closeModal();
    await syncPush();
    await pullAll(true);
    render();
    toast('ตั้งต้นข้อมูลแล้ว');
  };
}
async function importLegacy(old){
  try{
    state.shop = Object.assign(defaultShop(), old.shop || {});
    state.materials = old.materials.map(m=>Object.assign({ image:null }, m));
    state.overheadCosts = Array.isArray(old.overheadCosts) ? old.overheadCosts : defaultOverheads();
    closeModal();
    toast('กำลังนำเข้า…');
    await syncPush();
    const uidv = session.user.id;
    const chunk = (arr, n)=>{ const out=[]; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; };
    const pRows = (old.purchases||[]).map(p=>({ id:p.id, no:p.no, date:p.date, created_by:uidv, data:p }));
    const sRows = (old.sales||[]).map(s=>({ id:s.id, no:s.no, date:s.date, created_by:uidv, data:s }));
    for(const c of chunk(pRows,100)) await must(sb.from('purchases').upsert(c));
    for(const c of chunk(sRows,100)) await must(sb.from('sales').upsert(c));
    await pullAll(true);
    render();
    toast('นำเข้าข้อมูลเดิมแล้ว');
  }catch(e){
    console.error(e);
    toast('นำเข้าไม่สำเร็จ: '+friendlyErr(e),'err');
  }
}

/* ---------- จัดการผู้ใช้ (admin) ---------- */
function viewUsersPanel(){
  return `
    <div class="panel" style="max-width:640px; margin-bottom:18px;">
      <div class="panel-head"><h2>ผู้ใช้งาน</h2><button class="btn small" id="btnReloadUsers">รีเฟรช</button></div>
      <div id="usersPanelBody" class="modal-body" style="padding:0;"><div class="empty">กำลังโหลด…</div></div>
      <div class="field-hint" style="padding:12px 20px 16px;">
        <b>ผู้ดูแล (admin)</b> ทำได้ทุกอย่าง · <b>พนักงาน</b> ใช้ได้เฉพาะรับซื้อ/ขาย/ออกใบเสร็จ และเห็นเฉพาะใบเสร็จที่ตัวเองออก ·
        คนที่สมัครใหม่จะอยู่สถานะ “รออนุมัติ” จนกว่าจะเปลี่ยนที่นี่
      </div>
    </div>`;
}
async function loadUsersPanel(){
  const body = document.getElementById('usersPanelBody');
  if(!body || !isAdmin()) return;
  const btn = document.getElementById('btnReloadUsers');
  if(btn) btn.onclick = loadUsersPanel;
  const { data, error } = await sb.from('profiles').select('id,username,role,created_at').order('created_at');
  const body2 = document.getElementById('usersPanelBody');
  if(!body2) return;
  if(error){ body2.innerHTML = `<div class="empty">โหลดรายชื่อไม่สำเร็จ: ${esc(friendlyErr(error))}</div>`; return; }
  body2.innerHTML = `<div class="table-scroll"><table>
    <thead><tr><th>ชื่อผู้ใช้</th><th>สมัครเมื่อ</th><th>สิทธิ์</th></tr></thead>
    <tbody>${data.map(u=>{
      const me = u.id === session.user.id;
      return `<tr>
        <td class="pname">${esc(u.username)}${me?' <span class="tag sage">คุณ</span>':''}</td>
        <td>${fmtDate(u.created_at)}</td>
        <td>${me ? `<span class="tag">${roleLabel(u.role)}</span>` : `
          <select data-user-role="${u.id}" style="padding:6px 8px; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink);">
            ${['pending','staff','admin','disabled'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${roleLabel(r)}</option>`).join('')}
          </select>`}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
  body2.querySelectorAll('[data-user-role]').forEach(sel=>{
    sel.onchange = async ()=>{
      const { error:e2 } = await sb.from('profiles').update({ role: sel.value }).eq('id', sel.dataset.userRole);
      if(e2) toast('เปลี่ยนสิทธิ์ไม่สำเร็จ: '+friendlyErr(e2),'err');
      else toast('เปลี่ยนสิทธิ์แล้ว');
      loadUsersPanel();
    };
  });
}
